<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Radar</title>
  <style>
    /* ------------------------------------------------------------------
       Palette: high-end gold on near-black.
       Deliberately dark-first and applied in BOTH the default and the
       prefers-color-scheme:dark block, so the dashboard looks identical
       regardless of the OS setting rather than flipping to a white theme.
       Gold is reserved for actions and selection only — using it for text
       or borders as well makes it read as a warning, not as premium.
       ------------------------------------------------------------------ */
    :root {
      --bg: #0b0b0c;
      --bg-subtle: #131316;
      --bg-card: #17171a;
      --bg-active: #202024;
      --fg: #f4f4f0;
      --fg-muted: #9b9ba3;
      --border: #2a2a2f;
      --border-hover: #4a4a52;
      --accent: #ffc300;
      --accent-hover: #ffd447;
      --accent-fg: #0b0b0c;
      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.10);
      --success-border: rgba(52, 211, 153, 0.22);
      --warning: #fbbf24;
      --warning-bg: rgba(251, 191, 36, 0.10);
      --warning-border: rgba(251, 191, 36, 0.22);
      --error: #f87171;
      --error-bg: rgba(248, 113, 113, 0.10);
      --error-border: rgba(248, 113, 113, 0.22);
      --radius: 8px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.6);
      --shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.8), 0 2px 6px -2px rgba(0, 0, 0, 0.6);
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --scrape-grad-1: #ffc300;
      --scrape-grad-2: #ff9d00;
      --scrape-glow: rgba(255, 195, 0, 0.38);
      --scrape-disabled-bg: #232327;
      --scrape-disabled-fg: #6b6b73;
    }


    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0b0c;
        --bg-subtle: #131316;
        --bg-card: #17171a;
        --bg-active: #202024;
        --fg: #f4f4f0;
        --fg-muted: #9b9ba3;
        --border: #2a2a2f;
        --border-hover: #4a4a52;
        --accent: #ffc300;
        --accent-hover: #ffd447;
        --accent-fg: #0b0b0c;
        --success: #34d399;
        --success-bg: rgba(52, 211, 153, 0.10);
        --success-border: rgba(52, 211, 153, 0.22);
        --warning: #fbbf24;
        --warning-bg: rgba(251, 191, 36, 0.10);
        --warning-border: rgba(251, 191, 36, 0.22);
        --error: #f87171;
        --error-bg: rgba(248, 113, 113, 0.10);
        --error-border: rgba(248, 113, 113, 0.22);
        --scrape-grad-1: #ffc300;
        --scrape-grad-2: #ff9d00;
        --scrape-glow: rgba(255, 195, 0, 0.38);
        --scrape-disabled-bg: #232327;
        --scrape-disabled-fg: #6b6b73;
      }

    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.375rem 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--fg);
      transition: all 0.15s;
      user-select: none;
    }
    .btn:hover:not(:disabled) {
      background: var(--bg-active);
      border-color: var(--border-hover);
      color: #fff;
    }
    /* Gold hairline on keyboard focus — visible without shouting. */
    .btn:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 195, 0, 0.25);
    }
    .btn:active:not(:disabled) { background: var(--bg-active); }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
      font-weight: 600;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: var(--accent-fg);
    }
    /* Secondary/mini buttons pick up a gold edge on hover rather than a fill,
       so only one control on screen is ever solid gold. */
    .btn-mini:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(255, 195, 0, 0.07);
    }


    /* Page header — scrolls away normally. It is deliberately NOT sticky: it
       carries the title plus the CV and Scraper panels, and pinning all of that
       consumed ~443px of a 769px viewport, which made the page feel frozen. */
    .page-header {
      padding: 1.5rem 1.5rem 0 1.5rem;
    }

    /* Sticky Top Container — tabs + filter toolbar only (~105px). */
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem 0.75rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      /* No max-height/overflow here. Capping it at 45vh made the pinned bar
         grow its own scrollbar as soon as the filter row wrapped, which looked
         broken and put a second scroll region on the page. The bar is compact
         enough to size to its content. */
      overflow: visible;
    }

    .sticky-top::after {
      content: '';
      position: absolute;
      bottom: -10px; left: 0; right: 0;
      height: 10px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.05), transparent);
      pointer-events: none;
      opacity: 0.5;
    }
    @media (prefers-color-scheme: dark) {
      .sticky-top::after { background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent); }
    }

    /* Header & API Panels */
    .header-layout {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .header-main {
      flex: 1 1 300px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .header-main h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.025em; line-height: 1.2; }
    .header-main .subtitle { color: var(--fg-muted); font-size: 0.875rem; }
    
    .api-panels {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      flex: 0 0 auto;
    }
    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      min-width: 280px;
      max-width: 320px;
      box-shadow: var(--shadow-sm);
    }
    .panel-title { font-weight: 600; font-size: 0.875rem; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
    
    /* CV Panel */
    .cv-dropzone {
      border: 1px dashed var(--border-hover);
      border-radius: 6px;
      padding: 1rem;
      text-align: center;
      transition: all 0.2s;
      background: var(--bg-subtle);
      position: relative;
    }
    .cv-dropzone.dragover { background: var(--bg-active); border-color: var(--accent); }
    .cv-info { font-size: 0.875rem; margin-bottom: 0.75rem; }
    .cv-info strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cv-info .meta { color: var(--fg-muted); font-size: 0.75rem; margin-top: 0.25rem; }
    .cv-disclaimer { font-size: 0.7rem; color: var(--fg-muted); margin-top: 0.75rem; text-align: left; line-height: 1.4; }

    /* The upload control is a real <label for> driving a visually-hidden file
       input. The previous version stacked a transparent file input on top of a
       fake <button> that had pointer-events:none — so :hover/:active never
       fired on it and the control felt dead even though clicking did work.
       A label gets native click-to-open plus genuine interactive states, and
       stays keyboard reachable through the input itself. */
    .cv-file-input {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    .cv-upload-btn {
      display: block;
      width: 100%;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--accent-fg);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease, border-color 0.15s ease,
                  transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cv-upload-btn:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .cv-upload-btn:active { background: #e6ae00; border-color: #e6ae00; }
    /* :focus-visible cannot apply to the label, so mirror the input's focus. */
    .cv-file-input:focus-visible + .cv-upload-btn,
    .cv-upload-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    }
    .cv-dropzone:hover .cv-upload-btn { background: var(--accent-hover); border-color: var(--accent-hover); }
    @media (prefers-reduced-motion: reduce) {
      .cv-upload-btn { transition: none; }
      .cv-upload-btn:hover, .cv-upload-btn:active { transform: none; }
    }
    .cv-msg { font-size: 0.75rem; margin-top: 0.5rem; font-weight: 500; }
    .cv-msg.error { color: var(--error); }
    .cv-msg.success { color: var(--success); }

    /* Scrape Panel */
    .scrape-form { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
    .scrape-form label { font-size: 0.875rem; color: var(--fg-muted); white-space: nowrap; }
    .scrape-form input[type="number"] { width: 64px; text-align: center; }
    /* Strip the native spinner arrows — they are tiny, hard to hit, and this
       field is a plain 1-30 value that is quicker to type than to click up to. */
    .scrape-form input[type="number"]::-webkit-outer-spin-button,
    .scrape-form input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
    }
    .scrape-form input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .scrape-form .unit { font-size: 0.875rem; color: var(--fg-muted); }
    
    .scrape-action-row {
      display: flex;
      width: 100%;
      margin-bottom: 0.5rem;
    }
    
    /* Primary action. Flat gold, black label, no motion: the button used to
       lift on hover and sink on press with a spring curve, which read as
       gimmicky next to the rest of the UI. Colour alone carries the state. */
    .btn.btn-scrape {
      width: 100%;
      background: var(--accent);
      color: var(--accent-fg);
      border: 1px solid var(--accent);
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      letter-spacing: 0.02em;
      font-size: 0.85rem;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .btn.btn-scrape:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: var(--accent-fg);
    }

    .btn.btn-scrape:active:not(:disabled) {
      background: #e6ae00;
      border-color: #e6ae00;
    }

    .btn.btn-scrape:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    }

    .btn.btn-scrape:disabled {
      background: var(--scrape-disabled-bg);
      color: var(--scrape-disabled-fg);
      border-color: var(--border);
      opacity: 1;
    }

    .scrape-hint { font-size: 0.75rem; color: var(--fg-muted); margin-bottom: 0.75rem; line-height: 1.4; }


/* --- Smart Search panel -------------------------------------------------- */
.smart-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.btn-mini { padding: 0.15rem 0.5rem; font-size: 0.75rem; line-height: 1.5; }
.smart-groups { display: flex; flex-direction: column; gap: 0.5rem; margin: 0.5rem 0 0.75rem; }
/* ---------------------------------------------------------------------------
   Keyword group: the typed term on the left, its expansions revealed to the
   right on hover.
   Collapsed by default because a dozen keywords x ~7 synonyms filled the whole
   panel and buried the controls. The synonyms are still part of the query while
   hidden — the +N badge on the chip says how many.
   The 0fr -> 1fr grid track is what makes the width animate; animating
   max-width or display cannot be transitioned smoothly.
   --------------------------------------------------------------------------- */
.smart-group {
  display: flex; align-items: flex-start; gap: 0.4rem;
  border-left: 2px solid var(--border); padding-left: 0.5rem;
  outline: none;
}
.smart-group > .smart-chip.main { flex: 0 0 auto; }
/* The reveal is anchored to the chip and taken OUT OF FLOW. Inline, it grew the
   row on hover and shoved every keyword below it (and the CV suggestions) down
   the page. As an overlay it changes nothing in the layout.
   The panel is capped at 320px, so the popover is allowed to extend past its
   right edge — that is also what stops the chips wrapping one word per line. */
.smart-anchor { position: relative; display: inline-flex; }
.smart-reveal {
  position: absolute;
  top: 50%;
  left: calc(100% + 0.5rem);
  z-index: 60;
  width: max-content;
  max-width: 320px;
  padding: 0.4rem 0.45rem;
  border-radius: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border-hover);
  box-shadow: var(--shadow);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-50%) translateX(-8px);
  transition: opacity 0.2s ease,
              transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1),
              visibility 0s linear 0.2s;
}
.smart-group:hover .smart-reveal,
.smart-group:focus-within .smart-reveal {
  opacity: 1;
  visibility: visible;
  transform: translateY(-50%) translateX(0);
  transition-delay: 0s, 0s, 0s;
}
.smart-reveal-inner { min-width: 0; }
.smart-reveal .smart-sub { margin-top: 0; }
/* Staggered entry: each chip slides in slightly after the previous one. */
.smart-reveal .smart-chip.sub {
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity 0.25s ease, transform 0.25s ease;
  transition-delay: 0s;
}
.smart-group:hover .smart-chip.sub,
.smart-group:focus-within .smart-chip.sub {
  opacity: 1;
  transform: none;
  transition-delay: calc(60ms + var(--i, 0) * 28ms);
}
/* Count of related terms still active while the group is collapsed. */
.smart-more {
  font-size: 0.65rem; font-weight: 700; opacity: 0.75;
  padding-left: 0.15rem;
}

@media (prefers-reduced-motion: reduce) {
  .smart-reveal, .smart-reveal .smart-chip.sub { transition: none; }
}

.smart-sub { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.3rem; }
.smart-sub.muted, .smart-sub .muted, .muted { color: var(--fg-muted); font-size: 0.75rem; }
.smart-sec-title { font-size: 0.75rem; font-weight: 600; color: var(--fg-muted); margin: 0.75rem 0 0.25rem; text-transform: uppercase; letter-spacing: 0.03em; }
.smart-chip {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.15rem 0.45rem; border-radius: 999px;
  border: 1px solid var(--border); background: var(--bg-subtle);
  font-size: 0.75rem; color: var(--fg); cursor: pointer; font-family: inherit;
}
.smart-chip:hover { border-color: var(--accent); color: var(--accent); }
/* The typed keyword is the one solid-gold element in the group; its expansions
   stay neutral so the hierarchy is obvious at a glance. */
.smart-chip.main {
  background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
  cursor: default; font-weight: 600;
  box-shadow: 0 2px 10px rgba(255, 195, 0, 0.22);
}
.smart-chip.main:hover { color: var(--accent-fg); }
.smart-chip.main .smart-x:hover { color: #0b0b0c; opacity: 1; }
/* Active expansions get a subtle gold wash so "included" reads instantly. */
.smart-chip.sub:not(.off) { border-color: rgba(255, 195, 0, 0.35); }
.smart-group { border-left-color: rgba(255, 195, 0, 0.45) !important; }

/* Deselected: still visible and clickable to restore, but clearly excluded. */
.smart-chip.off { opacity: 0.45; text-decoration: line-through; }
/* Native-language title for a market outside the selected scope: kept in the
   list, but not searched until the scope covers it. */
.smart-chip.out-of-scope { opacity: 0.35; border-style: dashed; }
.smart-src { font-size: 0.65rem; opacity: 0.7; }
.smart-x { background: none; border: none; color: inherit; cursor: pointer; font-size: 0.9rem; line-height: 1; padding: 0 0 0 0.15rem; }
.smart-check { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; margin: 0.5rem 0; }

/* Header actions (Clear / Close) sit together on the right. */
.smart-head-actions { display: inline-flex; align-items: center; gap: 0.35rem; }
/* Keyword entry is the primary action: give it a clear focus ring and let the
   Add button sit flush beside it. */
#smart-input {
  flex: 1 1 auto; min-width: 0;
  transition: border-color 0.12s ease, box-shadow 0.12s ease;
}
#smart-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
}
/* Run button directly under the input once keywords exist — full width so it
   reads as the panel's primary action rather than another chip. */
#smart-run { width: 100%; }
.smart-groups { padding-top: 0.15rem; }
/* Live count of terms that will actually be searched. */
.smart-count {
  display: inline-block; margin-left: 0.35rem; padding: 0.05rem 0.4rem;
  border-radius: 999px; background: var(--accent); color: var(--accent-fg);
  font-size: 0.7rem; font-weight: 600; vertical-align: middle;
}
/* A CV suggestion is a two-part chip: the body adds it, the x dismisses it.
   Padding is dropped on the wrapper so the two buttons fill the pill. */
.smart-chip.cv { padding: 0; overflow: hidden; }
.smart-chip.cv .smart-chip-body {
  display: inline-flex; align-items: center; gap: 0.3rem;
  background: none; border: none; color: inherit; cursor: pointer;
  font-family: inherit; font-size: inherit;
  padding: 0.15rem 0.2rem 0.15rem 0.45rem;
}
.smart-chip.cv .smart-x { padding: 0.15rem 0.4rem 0.15rem 0.15rem; opacity: 0.55; }
.smart-chip.cv .smart-x:hover { opacity: 1; color: var(--danger, #ef4444); }
/* Already in the keyword list — shown for context but not re-addable. */
.smart-chip.cv.added { opacity: 0.5; border-style: dashed; }
.smart-chip.cv.added .smart-chip-body { cursor: default; }
.smart-chip.cv.added .smart-chip-body::before { content: '✓ '; }

@media (max-width: 640px) { .smart-sub { gap: 0.2rem; } .smart-chip { font-size: 0.7rem; } }


    /* Progress bar. Percentage lives in the label above the track so it stays
       legible at 0% and in both colour schemes. */
    .scrape-progress { margin-top: 0.5rem; }
    .scrape-progress-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 0.5rem; font-size: 0.75rem; color: var(--fg-muted); margin-bottom: 0.25rem;
    }
    .scrape-progress-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scrape-progress-pct { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg); }
    .scrape-progress-track {
      height: 8px; width: 100%; border-radius: 999px;
      background: var(--bg-active); overflow: hidden;
    }
    .scrape-progress-fill {
      height: 100%; border-radius: 999px; background: var(--accent);
      transition: width 0.35s ease;
    }
    .scrape-progress-fill.done { background: var(--success); }
    .scrape-progress-fill.failed { background: var(--error); }
    /* Denominator unknown yet (scraper has not announced its total): show motion
       instead of a misleading 0%. */
    .scrape-progress-fill.indeterminate {
      width: 35% !important;
      animation: scrape-indeterminate 1.2s ease-in-out infinite;
    }
    @keyframes scrape-indeterminate {
      0%   { margin-left: -35%; }
      100% { margin-left: 100%; }
    }
    .scrape-status { font-size: 0.875rem; margin-top: 0.5rem; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }
    
    /* Banners */
    .banner {
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 500;
      border: 1px solid transparent;
      margin-top: 0.5rem;
    }
    .banner.warning { background-color: var(--warning-bg); color: var(--warning); border-color: var(--warning-border); }
    .banner.info { background-color: var(--bg-subtle); color: var(--fg); border-color: var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    .banner-close { cursor: pointer; color: var(--fg-muted); background: none; border: none; font-size: 1.25rem; line-height: 1; padding: 0 0.25rem; }
    .banner-close:hover { color: var(--fg); }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--bg-subtle);
      padding: 0.375rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      gap: 0.25rem;
      align-self: flex-start;
    }
    .tab {
      user-select: none;
      -webkit-user-select: none;
      background: transparent;
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--fg-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .tab:hover { color: var(--fg); }
    .tab.active { background: var(--bg-card); color: var(--fg); box-shadow: var(--shadow-sm); }
    /* Country switcher. A themed popup rather than a native <select>: the OS
       draws select option lists itself and ignores the page colours, which on
       the dark theme produced a white panel with a blue highlight. */
    .tab-chevron {
      width: 0.4rem;
      height: 0.4rem;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: translateY(-2px) rotate(45deg);
      opacity: 0.65;
      margin-left: 0.15rem;
    }
    .tab-country[aria-expanded="true"] .tab-chevron {
      transform: translateY(2px) rotate(225deg);
    }
    .country-menu {
      position: fixed;
      z-index: 9999;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0.25rem;
      min-width: 190px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      /* Menu labels are controls, not prose. Without this, clicking through the
         list drag-selects the text and leaves a stray highlight block behind
         the count that looks like a rendering bug. */
      user-select: none;
      -webkit-user-select: none;
    }
    .country-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: none;
      background: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--fg-muted);
      text-align: left;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .country-menu-item:hover, .country-menu-item:focus-visible {
      background: var(--bg-active);
      color: var(--fg);
      outline: none;
    }
    /* The country currently being viewed, tinted with the same accent the
       active tab uses so the two agree at a glance. */
    .country-menu-item.is-current {
      background: var(--accent);
      color: var(--accent-fg);
    }
    .country-menu-item.is-current .badge-count {
      /* Transparent rather than a translucent white block: on the accent fill
         that block read as an accidental selection rectangle. */
      background: transparent;
      color: var(--accent-fg);
      font-weight: 700;
    }
    /* Countries with nothing in them stay listed (so you can always scrape or
       switch to them) but are visibly inert. */
    .country-menu-item.is-empty { opacity: 0.45; }
    .tab .badge-count {
      background: var(--border);
      color: var(--fg);
      padding: 0.125rem 0.375rem;
      border-radius: 999px;
      font-size: 0.7rem;
    }
    .tab.active .badge-count { background: var(--accent); color: var(--accent-fg); }

    /* Filters Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      align-items: flex-end;
    }
    .filter-group { display: flex; flex-direction: column; gap: 0.375rem; }
    .filter-label { font-size: 0.75rem; font-weight: 600; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    
    input[type="text"], input[type="number"], select {
      background: var(--bg-card);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      font-size: 0.875rem;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    input[type="text"] { width: 260px; }
    
    .checkboxes { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; min-height: 34px; }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.875rem;
      cursor: pointer;
      user-select: none;
      color: var(--fg);
    }
    input[type="checkbox"] { accent-color: var(--accent); width: 1rem; height: 1rem; cursor: pointer; }

    /* "Language req." filter: looks like the selects beside it, opens a themed
       checklist (same panel as the country menu) instead of an OS-drawn list. */
    .lang-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      min-width: 170px;
      max-width: 260px;
      background: var(--bg-card);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      font-size: 0.875rem;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .lang-btn:hover { border-color: var(--border-hover); }
    .lang-btn:focus-visible, .lang-btn[aria-expanded="true"] {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .lang-btn[aria-expanded="true"] .tab-chevron { transform: translateY(2px) rotate(225deg); }
    .lang-btn-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lang-menu-head {
      padding: 0.375rem 0.75rem 0.25rem;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }
    .lang-menu-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--fg);
      cursor: pointer;
    }
    .lang-menu-item:hover { background: var(--bg-active); }
    .lang-menu-item .badge-count {
      margin-left: auto;
      background: var(--border);
      color: var(--fg);
      padding: 0.125rem 0.375rem;
      border-radius: 999px;
      font-size: 0.7rem;
    }
    .lang-menu-empty { padding: 0.5rem 0.75rem; max-width: 240px; font-size: 0.8rem; color: var(--fg-muted); }
    .lang-menu-actions {
      display: flex;
      gap: 0.25rem;
      margin-top: 0.25rem;
      padding-top: 0.25rem;
      border-top: 1px solid var(--border);
    }
    .lang-menu-actions button {
      flex: 1;
      padding: 0.4rem;
      border: none;
      border-radius: 6px;
      background: none;
      color: var(--fg-muted);
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .lang-menu-actions button:hover { background: var(--bg-active); color: var(--fg); }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-left: auto;
      height: 34px;
    }
    .results-count { color: var(--fg-muted); font-size: 0.875rem; font-weight: 500; }
    .clear-filters { color: var(--error); font-size: 0.875rem; cursor: pointer; background: none; border: none; padding: 0; font-weight: 500; display: none; }
    .clear-filters:hover { text-decoration: underline; }
    .clear-filters.visible { display: inline-block; }

    /* Main Content */
    .main-content {
      padding: 0 1.5rem 3rem 1.5rem;
    }

    /* Jobs Grid */
    .jobs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
    }
    .job-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      box-shadow: var(--shadow-sm);
      position: relative;
      transition: all 0.15s ease;
      cursor: pointer; /* Makes entire card feel clickable */
    }
    /* Cards highlight rather than lift — a page full of nudging cards is noisy. */
    .job-card:hover {
      border-color: var(--border-hover);
      background: var(--bg-active);
    }
    .job-card.fit-high { border-left: 4px solid var(--success); }
    .job-card.fit-medium { border-left: 4px solid var(--warning); }
    .job-card.fit-low { border-left: 4px solid transparent; }

    .job-header { display: flex; flex-direction: column; gap: 0.25rem; }
    .job-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--fg);
    }
    .job-meta {
      font-size: 0.875rem;
      color: var(--fg-muted);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    
    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.25rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .badge-portal { background: var(--bg-subtle); border: 1px solid var(--border); color: var(--fg-muted); }
    /* Card rebuilt from job-states.json — the posting has aged out of the feed,
       so fit/score/salary are unknown and deliberately not shown. */
    .badge-archived { background: var(--bg-active); border: 1px dashed var(--border-hover); color: var(--fg-muted); }
    /* Auto-closed after 14 days of silence. Deliberately muted amber rather than
       the red of a real rejection — nobody actually said no. */
    .badge-ignored { background: var(--warning-bg); border: 1px solid var(--warning-border); color: var(--warning); }
    .badge-fit-high { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
    .badge-fit-medium { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); }
    .badge-fit-low { background: var(--bg-subtle); color: var(--fg-muted); border: 1px solid var(--border); }
    .badge-score { background: var(--bg-subtle); border: 1px solid var(--border); color: var(--fg-muted); }
    .badge-new { background: var(--accent); color: var(--accent-fg); border: 1px solid var(--accent); }
    .badge-date { color: var(--fg-muted); font-size: 0.75rem; margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: normal; }

    .salary { font-family: var(--font-mono); font-size: 0.875rem; font-weight: 500; color: var(--fg); }
    .salary.muted { color: var(--fg-muted); font-style: italic; font-weight: 400; font-family: var(--font-sans); }

    .chips-row { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.25rem; }
    .chip {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--fg-muted);
      padding: 0.125rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
    }
    .chip.matched { background: var(--bg-card); border-color: var(--border-hover); color: var(--fg); font-weight: 500; }
    .chip.eu-evidence { background: var(--success-bg); border-color: var(--success-border); color: var(--success); font-weight: 500; }
    .chip.lang-req { background: var(--warning-bg); border-color: var(--warning-border); color: var(--warning); font-weight: 500; }

    /* Health section */
    .health-section {
      margin-top: 3rem;
      border-top: 1px solid var(--border);
      padding-top: 2rem;
    }
    .health-section summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--fg);
      font-size: 1.1rem;
      user-select: none;
      display: inline-block;
    }
    .health-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .health-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }
    .health-card h3 {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      color: var(--fg-muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    .health-item {
      display: flex;
      flex-direction: column;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border-hover);
    }
    .health-item:last-child { border-bottom: none; }
    .health-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; }
    .health-query { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; }
    .health-meta { font-size: 0.75rem; color: var(--fg-muted); display: flex; gap: 0.5rem; }
    .health-status { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .status-ok { color: var(--success); }
    .status-error { color: var(--error); }
    .status-disabled { color: var(--fg-muted); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      background: var(--bg-subtle);
      border: 1px dashed var(--border-hover);
      border-radius: var(--radius);
      margin-top: 1rem;
    }
    .empty-state h2 { margin-bottom: 0.5rem; font-size: 1.25rem; }
    .empty-state p { color: var(--fg-muted); margin-bottom: 1rem; max-width: 500px; margin-inline: auto; }
    .empty-state code {
      background: var(--bg-card);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      border: 1px solid var(--border);
      display: inline-block;
    }

    /* Spinner */
    .spinner {
      animation: spin 1s linear infinite;
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .header-layout { flex-direction: column; }
      .api-panels { width: 100%; }
      .panel { flex: 1 1 100%; max-width: none; }
    }
    @media (max-width: 720px) {
      .toolbar { flex-direction: column; align-items: stretch; gap: 1rem; }
      input[type="text"] { width: 100%; }
      .checkboxes { flex-wrap: wrap; height: auto; }
      .toolbar-actions { margin-left: 0; justify-content: space-between; }
    }
  
    /* Context Menu */
    .context-menu {
      position: fixed;
      z-index: 9999;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0.25rem 0;
      min-width: 180px;
      font-size: 0.875rem;
      display: flex;
      flex-direction: column;
    }
    .context-menu-item {
      padding: 0.5rem 1rem 0.5rem 0.75rem;
      cursor: pointer;
      color: var(--fg);
      border: none;
      background: none;
      text-align: left;
      font-family: inherit;
      font-size: inherit;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    /* Each item carries a small colour dot rather than coloured label text.
       Colour-coding the whole row turns the menu into a rainbow; a dot keeps it
       scannable and calm, and the hue only floods in on hover. */
    .context-menu-item::before {
      content: '';
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ctx-accent, var(--fg-muted));
    }
    .context-menu-item:hover, .context-menu-item:focus {
      background: var(--ctx-tint, var(--bg-active));
      color: var(--ctx-accent, var(--fg));
      outline: none;
    }
    .context-menu-item.ctx-neutral { --ctx-accent: var(--accent); --ctx-tint: var(--bg-active); }
    .context-menu-item.ctx-applied { --ctx-accent: var(--success); --ctx-tint: var(--success-bg); }
    .context-menu-item.ctx-interview { --ctx-accent: var(--warning); --ctx-tint: var(--warning-bg); }
    .context-menu-item.ctx-rejected { --ctx-accent: var(--error); --ctx-tint: var(--error-bg); }
    .context-menu-item.ctx-danger { --ctx-accent: var(--error); --ctx-tint: var(--error-bg); }
    .context-menu-item.ctx-danger:hover { font-weight: 600; }
    .context-menu-separator {
      height: 1px;
      background: var(--border);
      margin: 0.25rem 0;
    }
    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--error);
      color: #ffffff;
      padding: 1rem 1.5rem;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
      z-index: 10000;
      display: flex;
      gap: 1rem;
      align-items: center;
      animation: slideUp 0.2s ease-out;
    }
    .toast button {
      background: #ffffff;
      border: none;
      color: var(--error);
      padding: 0.375rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
      transition: opacity 0.2s;
    }
    .toast button:hover {
      opacity: 0.9;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .job-card.is-applied {
      background-color: var(--success-bg);
      border-color: var(--success-border);
    }
    .badge-applied {
      background-color: var(--success);
      color: var(--accent-fg);
      border: 1px solid var(--success);
    }
    .job-card.is-interview {
      background-color: var(--warning-bg);
      border-color: var(--warning-border);
    }
    .badge-interview {
      background-color: var(--warning);
      color: var(--accent-fg);
      border: 1px solid var(--warning);
    }
    .job-card.is-rejected {
      background-color: var(--error-bg);
      border-color: var(--error-border);
    }
    .badge-rejected {
      background-color: var(--error);
      color: var(--accent-fg);
      border: 1px solid var(--error);
    }

<body>
  <div id="app" class="container">
    <!-- Rendered content injected here -->
  </div>

  <script src="./data/jobs.js"></script>
<script src="./smart-filter.js"></script>
  <script>
    (function() {
      const app = document.getElementById('app');
      const isHttp = location.protocol === 'http:' || location.protocol === 'https:';

      // Defensive initialization
      if (typeof window.JOBS === 'undefined') {
        app.innerHTML = `
          <div class="main-content" style="padding-top: 2rem;">
            <div class="empty-state" style="border-color: var(--error);">
              <h2 style="color: var(--error)">Data Not Found</h2>
              <p>The file <code>dashboard/data/jobs.js</code> is missing or empty.</p>
              <p>Please run the scraper to generate it:</p>
              <code>bun run dashboard/scrape-daily.ts</code>
            </div>
          </div>
        `;
        return;
      }

      // XSS Protection Helper
      const escapeHtml = (unsafe) => {
        if (unsafe == null) return '';
        return String(unsafe)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      };

      // Tagged template for safe HTML construction
      const html = (strings, ...values) => {
        return strings.reduce((acc, str, i) => {
          let val = values[i] !== undefined ? values[i] : '';
          // Must test for the marker key, not truthiness
          if (val && typeof val === 'object' && '__safeHtml' in val) {
            val = val.__safeHtml;
          } else if (Array.isArray(val)) {
            val = val.map(v => (v && typeof v === 'object' && '__safeHtml' in v) ? v.__safeHtml : escapeHtml(v)).join('');
          } else {
            val = escapeHtml(val);
          }
          return acc + str + val;
        }, '');
      };
      const safe = (str) => ({ __safeHtml: str });

      // URL Canonicalization Helper
      const canonUrl = (u) => {
        if (!u) return '';
        let c = u.toLowerCase();
        const qIdx = c.indexOf('?');
        if (qIdx !== -1) c = c.slice(0, qIdx);
        if (c.endsWith('/')) c = c.slice(0, -1);
        return c;
      };

      /**
       * Portal-independent identity for a posting — must stay byte-identical to
       * jobIdentity() in job-identity.ts, which the scraper and server use.
       *
       * A URL is not a stable identifier for a vacancy: it is listed on several
       * boards under different links, and the link that survives dedup changes
       * between runs. Keying saved state on company+title instead is what makes
       * "delete" stick.
       */
      const GENDER_MARKER = /\((?:[mwfdkxh][\/|\s]*){2,}\)/gi;
      const normIdentityPart = (s) => String(s == null ? '' : s)
        .toLowerCase()
        .replace(GENDER_MARKER, ' ')
        .replace(/[^\p{L}\p{N}]+/gu, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      const jobIdentity = (company, title) => {
        const c = normIdentityPart(company);
        const t = normIdentityPart(title);
        return (c && t) ? (c + '|' + t) : '';
      };

      // Relative Time Helper
      const getRelativeTime = (isoString) => {
        if (!isoString) return '';
        try {
          const date = new Date(isoString);
          if (isNaN(date.getTime())) return '';
          
          const diff = Date.now() - date.getTime();
          const seconds = Math.floor(diff / 1000);
          const minutes = Math.floor(seconds / 60);
          const hours = Math.floor(minutes / 60);
          const days = Math.floor(hours / 24);

          if (days > 1) return days + 'd ago';
          if (days === 1) return 'yesterday';
          if (hours > 0) return hours + 'h ago';
          if (minutes > 0) return minutes + 'm ago';
          return 'just now';
        } catch(e) {
          return '';
        }
      };

      const formatBytes = (bytes) => {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
      };

      // State
      // Mutable on purpose: a finished scrape rewrites data/jobs.json, and the
      // dashboard swaps these in place (see refreshJobsData) so the page shows
      // the new results without a full reload.
      let data = window.JOBS;
      let jobs = data.jobs || [];
      let counts = data.counts || { total: 0, new: 0, high: 0, medium: 0, pl: 0, eu: 0, applied: 0 };
      let profile = data.profile || {};
      let health = data.health || [];
      
      let jobStates = {};

      /**
       * Saved state indexed by vacancy identity, rebuilt whenever jobStates
       * changes. Entries are filed under a URL, but a vacancy outlives its URL,
       * so this is the index that actually makes "deleted stays deleted" work.
       */
      let jobStatesByIdentity = {};
      const reindexJobStates = () => {
        jobStatesByIdentity = {};
        for (const entry of Object.values(jobStates)) {
          const id = entry && (entry.identity || jobIdentity(entry.company, entry.title));
          if (!id) continue;
          // A vacancy can have several entries (one per board it was seen on).
          // Prefer the one carrying a stage, so a bare note never masks a delete.
          const cur = jobStatesByIdentity[id];
          if (!cur || (!cur.state && entry.state)) jobStatesByIdentity[id] = entry;
        }
      };

      /**
       * The single place that answers "what has the user done with this job?".
       * URL first (exact match wins), then identity (same vacancy, different
       * link). Everything that reads state must go through here.
       */
      const stateFor = (job) => {
        if (!job) return null;
        const byUrl = jobStates[canonUrl(job.url)];
        if (byUrl) return byUrl;
        const id = job.identity || jobIdentity(job.company, job.title);
        return (id && jobStatesByIdentity[id]) || null;
      };
      const stageOf = (job) => {
        const s = stateFor(job);
        return s && s.state ? s.state : null;
      };

      // Language requirements. scrape-daily.ts tags each job with the non-English
      // languages it requires (job.languages / job.languageReqs). The "Language
      // req." menu hides jobs per language; until you change it, the languages
      // your profile does not list at all (profile.languages in config.json) are
      // hidden. filters.hideLangs: null = that default, an array = your choice.
      const LANG_LABELS = {
        german: 'German', dutch: 'Dutch', french: 'French', polish: 'Polish', spanish: 'Spanish',
        italian: 'Italian', swedish: 'Swedish', norwegian: 'Norwegian', danish: 'Danish',
        finnish: 'Finnish', czech: 'Czech', portuguese: 'Portuguese', albanian: 'Albanian'
      };
      const langLabel = (l) => LANG_LABELS[l] || (l.charAt(0).toUpperCase() + l.slice(1));
      const defaultHiddenLangs = () => {
        const spoken = Object.keys((data.profile && data.profile.languages) || {}).map(s => s.toLowerCase());
        return Object.keys(LANG_LABELS).filter(l => !spoken.includes(l));
      };

      const defaultFilters = {
        text: '',
        fit: 'all',
        portal: 'all',
        newOnly: false,
        hideLangs: null,
        remoteOnly: false,
        sort: 'score'
      };
      
      let filters = { ...defaultFilters };
      let activeTab = 'PL';
      let euDismissed = false;

      try {
        const savedFilters = localStorage.getItem('jobradar.filters');
        if (savedFilters) {
          filters = { ...filters, ...JSON.parse(savedFilters) };
          delete filters.hideApplied;
          delete filters.showDeleted;
          // "Hide Polish-req" was a single checkbox before the language menu.
          if (filters.hidePolish && !Array.isArray(filters.hideLangs)) {
            filters.hideLangs = [...defaultHiddenLangs(), 'polish'];
          }
          delete filters.hidePolish;
        }
        const savedTab = localStorage.getItem('jobradar.tab');
        if (savedTab) activeTab = savedTab;
        euDismissed = localStorage.getItem('jobradar.eudismissed') === 'true';

        // After a scrape, lead with what was just pulled. Only fires once per
        // payload (keyed on generatedAt), so it never fights a tab you pick
        // manually while browsing the same data set.
        const stamp = String(data.generatedAt || '');
        const lastScope = String(data.lastScope || '').toUpperCase();
        if (stamp && lastScope && lastScope !== 'ALL'
            && localStorage.getItem('jobradar.seenstamp') !== stamp) {
          activeTab = lastScope;
          localStorage.setItem('jobradar.seenstamp', stamp);
          localStorage.setItem('jobradar.tab', activeTab);
        }
      } catch (e) {
        console.warn("Failed to load state from localStorage", e);
      }

      const saveFilters = () => {
        try {
          localStorage.setItem('jobradar.filters', JSON.stringify(filters));
        } catch (e) {}
      };
      const saveTab = () => {
        try {
          localStorage.setItem('jobradar.tab', activeTab);
        } catch (e) {}
      };
      const saveEuDismissed = () => {
        try {
          localStorage.setItem('jobradar.eudismissed', 'true');
        } catch (e) {}
      };

      const showToast = (msg, undoAction = null) => {
        const existing = document.getElementById('jobradar-toast');
        if (existing) existing.remove();
        
        const toast = document.createElement('div');
        toast.id = 'jobradar-toast';
        toast.className = 'toast';
        
        const span = document.createElement('span');
        span.textContent = msg;
        toast.appendChild(span);
        
        if (undoAction) {
          const btn = document.createElement('button');
          btn.textContent = 'Undo';
          btn.onclick = () => { undoAction(); toast.remove(); };
          toast.appendChild(btn);
        }
        
        document.body.appendChild(toast);
        setTimeout(() => { if (document.body.contains(toast)) toast.remove(); }, 6000);
      };

      const setJobState = async (job, state, note) => {
        const cUrl = canonUrl(job.url);
        const oldStateObj = stateFor(job);
        // Full copy of every entry this call may touch, so a failed save can be
        // rolled back exactly rather than approximately.
        const snapshot = JSON.parse(JSON.stringify(jobStates));
        
        const payload = { url: job.url, title: job.title, company: job.company };
        const newStateObj = oldStateObj ? { ...oldStateObj } : { title: job.title, company: job.company };
        
        if (state !== undefined) {
          payload.state = state;
          if (state === null) {
            delete newStateObj.state;
          } else {
            newStateObj.state = state;
            newStateObj.at = new Date().toISOString();
          }
        }
        
        if (note !== undefined) {
          payload.note = note;
          if (note === '') {
            delete newStateObj.note;
          } else {
            newStateObj.note = note;
            newStateObj.noteAt = new Date().toISOString();
          }
        }

        // Optimistic UI. The change is applied to every entry this vacancy has
        // accumulated under other boards' URLs, not just the card that was
        // clicked — otherwise deleting one copy leaves its twin on screen until
        // the next reload.
        const identity = job.identity || jobIdentity(job.company, job.title);
        newStateObj.identity = identity || undefined;
        const affected = [cUrl, ...Object.keys(jobStates).filter(k => {
          const e = jobStates[k];
          return k !== cUrl && identity && e &&
            (e.identity || jobIdentity(e.company, e.title)) === identity;
        })];
        if (!newStateObj.state && !newStateObj.note) {
          for (const k of affected) delete jobStates[k];
        } else {
          jobStates[cUrl] = newStateObj;
          for (const k of affected) {
            if (k !== cUrl) jobStates[k] = { ...jobStates[k], ...newStateObj };
          }
        }
        reindexJobStates();

        updateJobsList();

        if (isHttp) {
          try {
            const res = await fetch('/api/job-states', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('API failed');
          } catch (e) {
            for (const k of affected) delete jobStates[k];
            for (const [k, v] of Object.entries(snapshot)) jobStates[k] = v;
            reindexJobStates();
            updateJobsList();
            showToast('Error saving state');
          }
        } else {
          try {
            localStorage.setItem('jobradar.jobStates', JSON.stringify(jobStates));
          } catch (e) {
            showToast('Error saving to local storage');
          }
        }
      };

      const loadJobStates = async () => {
        if (isHttp) {
          try {
            const res = await fetch('/api/job-states');
            if (res.ok) jobStates = await res.json();
          } catch(e) {}
        } else {
          try {
            const s = localStorage.getItem('jobradar.jobStates');
            if (s) jobStates = JSON.parse(s);
          } catch(e) {}
        }
        reindexJobStates();
      };

      // Gather distinct portals
      let portals = Array.from(new Set(jobs.map(j => j.portal).filter(Boolean))).sort();

      // Staleness check
      let isStale = false;
      let generatedAtDate = null;
      const recomputeDerived = () => {
        portals = Array.from(new Set(jobs.map(j => j.portal).filter(Boolean))).sort();
        isStale = false;
        generatedAtDate = null;
        if (data.generatedAt) {
          generatedAtDate = new Date(data.generatedAt);
          if (isNaN(generatedAtDate.getTime())) {
            generatedAtDate = null;
          } else {
            isStale = (Date.now() - generatedAtDate.getTime()) > 36 * 60 * 60 * 1000;
          }
        }
      };
      recomputeDerived();

      /**
       * Swap in the snapshot a finished scrape just wrote and re-render.
       *
       * The initial payload arrives as a <script src="data/jobs.js"> global,
       * which cannot be re-evaluated without reloading the page, so the refresh
       * path reads the identical payload from data/jobs.json instead. The
       * filter/tab/scroll state lives in this closure and is deliberately left
       * untouched — the user keeps their place, only the data underneath moves.
       */
      const refreshJobsData = async () => {
        try {
          const res = await fetch('./data/jobs.json?t=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const fresh = await res.json();
          if (!fresh || !Array.isArray(fresh.jobs)) throw new Error('malformed jobs.json');

          data = fresh;
          window.JOBS = fresh;
          jobs = fresh.jobs;
          counts = fresh.counts || { total: 0, new: 0, high: 0, medium: 0, pl: 0, eu: 0, applied: 0 };
          profile = fresh.profile || {};
          health = fresh.health || [];
          recomputeDerived();

          // States are swept server-side against the new snapshot, so re-read
          // them rather than trusting the copy taken at page load.
          await loadJobStates();

          const y = window.scrollY;
          initUI();
          window.scrollTo(0, y);
          return true;
        } catch (e) {
          return false;
        }
      };

      // API State
      let scrapeState = { running: false, log: '', startedAt: null, exitCode: null, error: null, progress: null, progressDismissed: false };


      // Which slice of the configured sources a manual scrape should run.
      // Persisted like the other UI preferences so it survives a reload.
      let scrapeScope = 'PL';
      try {
        const savedScope = localStorage.getItem('jobradar.scrapescope');
        if (savedScope) scrapeScope = savedScope;
      } catch (e) {}
      const saveScrapeScope = () => {
        try { localStorage.setItem('jobradar.scrapescope', scrapeScope); } catch (e) {}
      };
      let scrapePollTimer = null;

      // Render Functions
      const renderHeader = () => {
        const localTime = generatedAtDate ? generatedAtDate.toLocaleString() : 'Unknown';
        const relTime = generatedAtDate ? getRelativeTime(data.generatedAt) : 'Unknown';
        const jobage = data.jobageDays != null ? data.jobageDays : '?';
        const titleText = (profile.title || 'Professional') + ' | ' + (profile.homeCity || 'Location');
        
        let bannerHtml = '';
        if (isStale) {
          bannerHtml = html`<div class="banner warning">Data is over 36 hours old. Daily 09:00 scrape has not run recently.</div>`;
        }

        let apiPanelsHtml = '';
        if (isHttp) {
          apiPanelsHtml = html`
            <div class="api-panels">
              <div class="panel" id="cv-panel">
                ${safe(renderCVContent())}
              </div>
              <div class="panel" id="scrape-panel">
                ${safe(renderScrapeContent())}
              </div>
            </div>
          `;
        } else {
          apiPanelsHtml = html`
            <div class="api-panels">
              <div class="panel" style="background: var(--bg-subtle);">
                <div class="panel-title" style="color: var(--fg-muted);">API Features Disabled</div>
                <div style="font-size: 0.875rem; color: var(--fg-muted);">
                  Viewing via file:// protocol. Run <code>bun run dashboard/serve.ts</code> to enable CV upload and manual scraping.
                </div>
              </div>
            </div>
          `;
        }

        return html`
          <div class="header-layout">
            <div class="header-main">
              <h1>Job Radar</h1>
              <div class="subtitle">
                ${titleText}<br>
                Last updated: ${relTime} (${localTime}) — showing posts up to ${jobage} day(s) old
              </div>
              ${safe(bannerHtml)}
            </div>
            ${safe(apiPanelsHtml)}
          </div>
        `;
      };

      const renderCVContent = (msg = null, msgType = '') => {
        const cv = data.cv;
        let cvInfoHtml = cv 
          ? html`
            <div class="cv-info">
              <strong>${cv.originalName}</strong>
              <div class="meta">${formatBytes(cv.sizeBytes)} • Uploaded ${getRelativeTime(cv.uploadedAt)}</div>
            </div>
          ` 
          : html`<div class="cv-info" style="color: var(--fg-muted);">No CV on file</div>`;

        let msgHtml = msg ? html`<div class="cv-msg ${msgType}">${msg}</div>` : '';

        return html`
          <div class="panel-title">Your CV</div>
          <div class="cv-dropzone" id="cv-dropzone">
            ${safe(cvInfoHtml)}
            <input type="file" id="cv-upload-input" class="cv-file-input" accept=".pdf,.doc,.docx,.txt,.md,.rtf,.odt">
            <label class="cv-upload-btn" for="cv-upload-input" title="Choose a file, or drop one anywhere in this box">Upload CV</label>
            ${safe(msgHtml)}
          </div>
          <div class="cv-disclaimer">Stored for reference only - it does not change your search queries. Edit dashboard/config.json to change what is searched.</div>
        `;
      };

      /**
       * Live scrape progress bar.
       *
       * Shared by the Scraper panel and Smart Search so a Smart Search reports
       * exactly like "Scrape Now" — both drive the same server-side job, so
       * showing it two different ways (or not at all) was just confusing.
       * Returns '' when there is nothing to show.
       */
      const renderScrapeProgress = () => {
        const p = scrapeState.progress;
        if (!scrapeState.running && !p) return '';
        // Hidden once a successful run has been on screen long enough to read.
        if (!scrapeState.running && scrapeState.progressDismissed) return '';

        const failed = !scrapeState.running && (scrapeState.exitCode !== null && scrapeState.exitCode !== 0 || scrapeState.error);
        const finished = !scrapeState.running && scrapeState.exitCode === 0;
        // total === 0 means the scraper has not announced its denominator yet.
        const known = !!p && p.total > 0;
        const pct = known ? Math.max(0, Math.min(100, p.percent)) : 0;
        const fillClass = 'scrape-progress-fill'
          + (finished ? ' done' : '')
          + (failed ? ' failed' : '')
          + (!known && scrapeState.running ? ' indeterminate' : '');
        const pctText = known ? pct + '%' : '—';
        const stepText = known ? ' (' + p.done + '/' + p.total + ')' : '';
        const label = (p && p.label) ? p.label : (scrapeState.running ? 'Starting…' : '');

        return html`
          <div class="scrape-progress" role="progressbar"
               aria-valuemin="0" aria-valuemax="100"
               ${known ? safe('aria-valuenow="' + pct + '"') : ''}
               aria-label="Scrape progress">
            <div class="scrape-progress-head">
              <span class="scrape-progress-label">${label}${stepText}</span>
              <span class="scrape-progress-pct">${pctText}</span>
            </div>
            <div class="scrape-progress-track">
              <div class="${fillClass}" style="width: ${known ? pct : 0}%"></div>
            </div>
          </div>
        `;
      };

      const renderScrapeContent = () => {
        // The Scraper and Smart Search share one panel slot: they drive the same
        // backend job and only one can run at a time, so showing both side by
        // side invited starting two scrapes at once. Smart Search takes the
        // panel over completely while it is open.
        if (smartState.open) return renderSmartContent();

        const defaultJobage = data.jobageDays || 7;
        const p = scrapeState.progress;

        let statusHtml = '';
        if (scrapeState.running) {
          const elapsed = scrapeState.startedAt ? Math.floor((Date.now() - new Date(scrapeState.startedAt).getTime()) / 1000) : 0;
          statusHtml = html`<div class="scrape-status"><span class="spinner"></span> Running... ${elapsed}s</div>`;
        } else if (scrapeState.exitCode === 0) {
          statusHtml = html`
            <div class="scrape-status" style="color: var(--success);">Done!</div>
            <button class="btn btn-primary" style="margin-top:0.5rem; width:100%;" onclick="location.reload()">Reload Page</button>
          `;
        } else if (scrapeState.exitCode !== null || scrapeState.error) {
          statusHtml = html`<div class="scrape-status" style="color: var(--error);">Failed: ${scrapeState.error || 'Exit code ' + scrapeState.exitCode}</div>`;
        }

        // Progress bar: shown while running and kept on screen afterwards so the
        // final 100% / failure point stays visible instead of vanishing.
        const progressHtml = renderScrapeProgress();


        // The raw scraper log is deliberately NOT rendered. It was noisy, and the
        // bar + percentage already answer the only question being asked ("how far
        // along is it?"). Failures still surface via statusHtml above.

        return html`
          <div class="panel-title smart-head">
            <span>Scraper</span>
            <button class="btn btn-mini" id="smart-toggle" title="Switch to keyword search">Smart Search</button>
          </div>

          <div class="scrape-form">
            <label for="scrape-scope">Search in:</label>
            <select id="scrape-scope" ${scrapeState.running ? safe('disabled') : ''}>
              <option value="PL" ${scrapeScope === 'PL' ? safe('selected') : ''}>Poland</option>
              <option value="DE" ${scrapeScope === 'DE' ? safe('selected') : ''}>Germany</option>
              <option value="NL" ${scrapeScope === 'NL' ? safe('selected') : ''}>Netherlands</option>
              <option value="EU" ${scrapeScope === 'EU' ? safe('selected') : ''}>EU remote</option>
              <option value="ALL" ${scrapeScope === 'ALL' ? safe('selected') : ''}>Everywhere</option>
            </select>
          </div>
          <div class="scrape-form">
            <label for="scrape-jobage">Max job age:</label>
            <input type="number" id="scrape-jobage" value="${defaultJobage}" min="1" max="30"
                   title="Only fetch postings published within the last N days"
                   ${scrapeState.running ? safe('disabled') : ''}>
            <span class="unit">days</span>
          </div>
          <div class="scrape-action-row">
            <button class="btn btn-scrape" id="btn-scrape" ${scrapeState.running ? safe('disabled') : ''}>Scrape Now</button>
            ${scrapeState.running ? safe(html`<button class="btn btn-mini" id="btn-scrape-cancel" title="Stop the running scrape">Cancel</button>`) : safe('')}
          </div>

          <div class="scrape-hint">Only fetch job posts published in the last <strong id="scrape-hint-days">${defaultJobage}</strong> day(s). Lower = fresher results, higher = wider net (1–30).</div>
          ${safe(statusHtml)}
          ${safe(progressHtml)}
        `;
      };

      // ---------------------------------------------------------------------
      // Smart Search panel.
      //
      // Ad-hoc keyword search with expansion preview. Deliberately separate
      // from the Scraper panel: that one runs the CURATED queries in
      // config.json, this one runs whatever is typed here. Neither writes to
      // config.json, so the scheduled 09:00 run is unaffected either way.
      // ---------------------------------------------------------------------

      // term -> { expanding, terms:[{term,reason,source}], off:Set<string> }
      const smartState = {
        keywords: [],
        expansions: {},
        cv: null,
        cvLoading: false,
        useLlm: false,
        llmAvailable: false,
        error: null,
        lastQueries: null,
        open: false,
        refocus: false,
        // Max job age typed into Smart Search. Held in state because the panel
        // re-renders via innerHTML on every keyword add/expansion, and a
        // hardcoded value="7" reset whatever the user had entered.
        jobage: 7,
        // Panel folded to its header, e.g. after scrolling down to the jobs.
        collapsed: false,
        // CV-derived terms the user has dismissed. Kept separately from
        // `keywords` because the CV list is regenerated server-side on every
        // load — without this, a removed suggestion reappears on refresh.
        cvHidden: [],
        // Scope picked in this panel (null = follow the Scraper's scope). It
        // decides which native-language titles (PL/DE/NL) a run includes.
        scope: null,
        // Most terms one search may run, read from GET /api/scrape (null until
        // the server answers). Above it the run button is disabled up front;
        // the server used to cut the list at 25 without saying so.
        maxTerms: null,
      };

      // ---------------------------------------------------------------------
      // Persistence.
      //
      // The keyword list used to live only in memory, so every refresh wiped it
      // and the whole list had to be retyped. Expansions are stored alongside
      // the keywords rather than re-fetched on load: they are deterministic for
      // a given term, and this keeps a reload instant and works with the server
      // down.
      //
      // Sets are not JSON-serialisable, so `off` is persisted as an array and
      // rehydrated below.
      // ---------------------------------------------------------------------
      const SMART_STORE = 'jobradar.smart.v1';

      const smartSave = () => {
        try {
          const expansions = {};
          for (const [kw, ex] of Object.entries(smartState.expansions)) {
            if (!ex || ex.expanding) continue; // don't persist in-flight state
            expansions[kw] = {
              terms: ex.terms || [],
              off: Array.from(ex.off || []),
              engine: ex.engine || 0,
            };
          }
          localStorage.setItem(SMART_STORE, JSON.stringify({
            keywords: smartState.keywords,
            expansions,
            useLlm: smartState.useLlm,
            cvHidden: smartState.cvHidden,
            open: smartState.open,
            jobage: smartState.jobage,
            scope: smartState.scope,
          }));
        } catch (e) {
          // Private mode / quota. Non-fatal: the panel still works in-memory.
          console.warn('smart search: could not save state', e);
        }
      };

      const smartLoad = () => {
        try {
          const raw = localStorage.getItem(SMART_STORE);
          if (!raw) return;
          const s = JSON.parse(raw);
          if (Array.isArray(s.keywords)) smartState.keywords = s.keywords;
          if (Array.isArray(s.cvHidden)) smartState.cvHidden = s.cvHidden;
          smartState.useLlm = !!s.useLlm;
          smartState.open = !!s.open;
          const age = Number(s.jobage);
          if (Number.isInteger(age) && age >= 1 && age <= 30) smartState.jobage = age;
          if (typeof s.scope === 'string' && s.scope in SCOPE_LANGS) smartState.scope = s.scope;
          if (s.expansions && typeof s.expansions === 'object') {
            for (const [kw, ex] of Object.entries(s.expansions)) {
              smartState.expansions[kw] = {
                expanding: false,
                terms: Array.isArray(ex.terms) ? ex.terms : [],
                off: new Set(Array.isArray(ex.off) ? ex.off : []),
                engine: Number(ex.engine) || 0,
              };
            }
          }
        } catch (e) {
          console.warn('smart search: could not restore state', e);
        }
      };



      const SOURCE_LABEL = {
        original: 'typed',
        correction: 'fixed',
        synonym: 'synonym',
        abbreviation: 'abbrev',
        contraction: 'short',
        spelling: 'spelling',
        role: 'title',
        vendor: 'related',
        llm: 'AI',
      };
      const sourceLabel = (t) =>
        t.source === 'translation' && t.lang ? t.lang.toUpperCase() : (SOURCE_LABEL[t.source] || t.source);

      // Must match EXPAND_ENGINE in keyword-expand.ts. Previews stored by an
      // older engine are refreshed on load, keeping the user's deselections.
      const EXPAND_ENGINE = 2;

      // Native-language titles (source 'translation') are only searched when the
      // run's scope covers their market. EU remote postings are in English.
      const SCOPE_LANGS = { PL: ['pl'], DE: ['de'], NL: ['nl'], EU: [], ALL: ['pl', 'de', 'nl'] };
      const smartScope = () => smartState.scope || scrapeScope;
      const termInScope = (t) =>
        t.source !== 'translation' || !t.lang || (SCOPE_LANGS[smartScope()] || []).includes(t.lang);

      /** Every term that will actually be searched, minus user-deselected ones
       *  and native-language titles outside the selected scope. */
      const smartSelectedTerms = () => {
        const out = [];
        const seen = new Set();
        for (const kw of smartState.keywords) {
          const ex = smartState.expansions[kw];
          const list = ex && ex.terms ? ex.terms.filter(termInScope).map(t => t.term) : [kw];
          for (const t of list) {
            if (ex && ex.off && ex.off.has(t)) continue;
            if (seen.has(t)) continue;
            seen.add(t);
            out.push(t);
          }
        }
        return out;
      };

      // Only ever called while smartState.open is true — renderScrapeContent
      // hands the panel over. There is no collapsed variant any more: closing
      // Smart Search returns the panel to the Scraper.
      const renderSmartContent = () => {


        const chips = smartState.keywords.map(kw => {
          const ex = smartState.expansions[kw];
          let sub = '';
          let extraCount = 0;
          if (ex && ex.expanding) {
            sub = html`<div class="smart-sub muted">expanding…</div>`;
          } else if (ex && ex.terms) {
            const extras = ex.terms.filter(t => t.source !== 'original');
            extraCount = extras.filter(t => !(ex.off && ex.off.has(t.term)) && termInScope(t)).length;
            sub = html`<div class="smart-sub">${safe(extras.map((t, i) => {
              const off = ex.off && ex.off.has(t.term);
              const outOfScope = !termInScope(t);
              // Per-chip delay produces a staggered reveal instead of the whole
              // row appearing at once.
              return html`<button class="smart-chip sub ${off ? 'off' : ''} ${outOfScope ? 'out-of-scope' : ''}"
                style="--i:${i}"
                data-kw="${kw}" data-term="${t.term}"
                title="${t.reason}${outOfScope ? ' — not searched: outside the selected scope' : ''}">${t.term}<span class="smart-src">${sourceLabel(t)}</span></button>`;
            }).join(''))}</div>`;
          }
          // Expansions are collapsed until the keyword is hovered/focused, so a
          // dozen keywords stay readable. The badge keeps the hidden count
          // visible while collapsed — they are still part of the query.
          const badge = extraCount
            ? html`<span class="smart-more" title="${extraCount} related term${extraCount === 1 ? '' : 's'} included">+${extraCount}</span>`
            : '';
          return html`
            <div class="smart-group" tabindex="0">
              <span class="smart-anchor">
                <span class="smart-chip main">${kw}${safe(badge)}<button class="smart-x" data-remove="${kw}" title="Remove">×</button></span>
                <div class="smart-reveal"><div class="smart-reveal-inner">${safe(sub)}</div></div>
              </span>
            </div>`;
        }).join('');


        let cvHtml = '';
        if (smartState.cvLoading) {
          cvHtml = html`<div class="smart-sub muted">reading CV…</div>`;
        } else if (smartState.cv && smartState.cv.empty) {
          cvHtml = html`<div class="smart-sub muted">No keywords could be read from the stored CV. If it is a scanned image or a .docx, upload a text-based PDF to enable this.</div>`;
        } else if (smartState.cv && smartState.cv.keywords) {
          const hidden = new Set(smartState.cvHidden);
          const added = new Set(smartState.keywords.map(k => k.toLowerCase()));
          const visible = smartState.cv.keywords.filter(k => !hidden.has(k.term));
          if (!visible.length) {
            cvHtml = html`<div class="smart-sub muted">All CV suggestions dismissed.</div>`;
          } else {
            cvHtml = html`<div class="smart-sub">${safe(visible.map(k => {
              const isAdded = added.has(k.term.toLowerCase());
              // The chip body adds the term; the × dismisses the suggestion.
              return html`<span class="smart-chip cv ${isAdded ? 'added' : ''}" title="${k.reason}">
                <button class="smart-chip-body" data-add="${k.term}" ${isAdded ? safe('disabled') : ''}>${k.term}<span class="smart-src">${k.score}</span></button>
                <button class="smart-x" data-cv-remove="${k.term}" title="Dismiss this suggestion">×</button>
              </span>`;
            }).join(''))}</div>`;
          }
          if (hidden.size) {
            cvHtml += html`<div class="smart-sub"><button class="btn btn-mini" id="smart-cv-restore">Restore ${hidden.size} dismissed</button></div>`;
          }
        }


        const total = smartSelectedTerms().length;
        const maxTerms = smartState.maxTerms;
        const tooMany = maxTerms !== null && total > maxTerms;
        // Only the RUN control is gated on a live scrape. Building the keyword
        // list is local state and costs nothing, so disabling the input and Add
        // button here meant a stuck scrape locked the panel outright.
        const busy = scrapeState.running;

        // The run button is rendered in ONE of two places, never both (a second
        // copy would duplicate the id and break the listener). Once keywords
        // exist it sits directly under the input, so it is reachable without
        // scrolling past a long chip list.
        const runLabel = busy
          ? 'Searching…'
          : tooMany
            ? 'Too many terms: ' + total + ' (max ' + maxTerms + ')'
            : (total ? 'Search ' + total + ' term' + (total === 1 ? '' : 's') : 'Add a keyword');
        // Same id as the Scraper's Cancel: only one of the two views is ever in
        // the panel, and bindScrapeCancel() wires whichever is present.
        const cancelBtnHtml = busy
          ? html`<button class="btn btn-mini" id="btn-scrape-cancel" title="Stop the running search">Cancel</button>`
          : '';
        const runBtn = html`
          <div class="scrape-action-row">
            <button class="btn btn-scrape" id="smart-run" ${busy || !total || tooMany ? safe('disabled') : ''}>${runLabel}</button>
            ${safe(cancelBtnHtml)}
          </div>
          ${tooMany && !busy ? safe(html`<div class="smart-sub muted">One search runs at most ${maxTerms} terms. Hover a keyword and click related terms to switch them off, or remove a keyword.</div>`) : safe('')}`;
        const runAtTop = smartState.keywords.length > 0;

        // Mirrors the Scraper panel: the same live progress bar, so a Smart
        // Search looks and behaves like "Scrape Now" instead of silently
        // running with no feedback.
        const progressHtml = renderScrapeProgress();

        // Folded view (after scrolling down to the job list): header, keyword
        // count and live progress only, so a running search stays visible.
        if (smartState.collapsed) {
          return html`
            <div class="panel-title smart-head">
              <span>Smart Search${total ? safe(html` <span class="smart-count">${total}</span>`) : safe('')}</span>
              <span class="smart-head-actions">
                <button class="btn btn-mini" id="smart-expand" title="Show the Smart Search panel">Expand</button>
                ${safe(cancelBtnHtml)}
              </span>
            </div>
            ${safe(progressHtml)}
          `;
        }
        // Scope and job age are needed to interpret the run button, so they sit
        // with it at the top rather than below a chip list that can run to
        // several screens.
        const optionsHtml = html`
          <div class="smart-options">
            <div class="scrape-form">
              <label for="smart-scope">Search in:</label>
              <select id="smart-scope" ${busy ? safe('disabled') : ''}>
                <option value="PL" ${smartScope() === 'PL' ? safe('selected') : ''}>Poland</option>
                <option value="DE" ${smartScope() === 'DE' ? safe('selected') : ''}>Germany</option>
                <option value="NL" ${smartScope() === 'NL' ? safe('selected') : ''}>Netherlands</option>
                <option value="EU" ${smartScope() === 'EU' ? safe('selected') : ''}>EU remote</option>
                <option value="ALL" ${smartScope() === 'ALL' ? safe('selected') : ''}>Everywhere</option>
              </select>
            </div>
            <div class="scrape-form">
              <label for="smart-jobage">Max job age:</label>
              <input type="number" id="smart-jobage" value="${smartState.jobage}" min="1" max="30" ${busy ? safe('disabled') : ''}>
              <span class="unit">days</span>
            </div>
          </div>`;

        return html`
