          <div class="panel-title smart-head">
            <span>Smart Search${total ? safe(html` <span class="smart-count">${total}</span>`) : safe('')}</span>
            <span class="smart-head-actions">
              ${smartState.keywords.length ? safe(html`<button class="btn btn-mini" id="smart-clear" title="Remove all keywords">Clear</button>`) : safe('')}
              <button class="btn btn-mini" id="smart-toggle" title="Back to the Scraper">Scraper</button>
            </span>
          </div>

          <div class="scrape-form">
            <input type="text" id="smart-input" placeholder="e.g. network architect" autocomplete="off">
            <button class="btn btn-mini" id="smart-add">Add</button>
          </div>

          ${safe(optionsHtml)}
          ${runAtTop ? safe(runBtn) : safe('')}
          ${safe(progressHtml)}

          ${smartState.keywords.length
            ? safe(html`<div class="smart-groups">${safe(chips)}</div>`)
            : safe(html`<div class="smart-sub muted">No keywords yet. Type one above, or pick from your CV below. Your list is saved and restored on refresh.</div>`)}



          <label class="smart-check" title="${smartState.llmAvailable ? 'Ask an AI for extra title variants' : 'Set OPENAI_API_KEY or ANTHROPIC_API_KEY to enable'}">
            <input type="checkbox" id="smart-llm" ${smartState.useLlm ? safe('checked') : ''} ${smartState.llmAvailable ? safe('') : safe('disabled')}>
            Use AI suggestions ${smartState.llmAvailable ? safe('') : safe('<span class="muted">(no API key)</span>')}
          </label>

          <div class="smart-sec-title">From your CV</div>
          ${safe(cvHtml)}

          ${runAtTop ? safe('') : safe(runBtn)}


          ${smartState.error ? safe(html`<div class="banner warning">${smartState.error}</div>`) : safe('')}
          ${smartState.lastQueries ? safe(html`<div class="smart-sub muted">Searching: ${smartState.lastQueries.join(', ')}</div>`) : safe('')}
        `;
      };


      const renderTabs = () => {
        const pc = pipelineCounts();
        const counted = countryCounts();

        // One tab per country that actually has jobs, led by whatever was
        // scraped most recently, then the rest by size. Countries with nothing
        // in them are omitted entirely rather than sitting there showing 0.
        // Every country sits behind ONE button. Poland leads the list as the
        // primary market; the rest follow by most-recently-scraped then size.
        // A native <select> was used here before, but its popup is drawn by the
        // OS and ignores the page theme entirely — it rendered as a white/blue
        // list on the dark UI. This is a themed menu instead.
        const ordered = allCountryOptions(counted);
        const current = ordered.includes(activeTab) ? activeTab : (ordered[0] || PINNED_COUNTRY);
        const countryActive = ordered.includes(activeTab);

        const countryTab = html`
          <button class="tab tab-country ${countryActive ? 'active' : ''}"
                  id="country-btn" aria-haspopup="menu" aria-expanded="false">
            ${COUNTRY_LABELS[current] || current}
            <span class="badge-count">${counted[current] || 0}</span>
            <span class="tab-chevron" aria-hidden="true"></span>
          </button>
        `;

        return html`
          <div class="tabs">
            ${safe(countryTab)}
            <button class="tab ${activeTab === 'All' ? 'active' : ''}" data-tab="All">
              All <span class="badge-count">${counted.__all || 0}</span>
            </button>
            <button class="tab ${activeTab === 'Applied' ? 'active' : ''}" data-tab="Applied">
              Applied <span class="badge-count">${pc.applied}</span>
            </button>
            <button class="tab ${activeTab === 'Interview' ? 'active' : ''}" data-tab="Interview">
              Interview <span class="badge-count">${pc.interview}</span>
            </button>
            <button class="tab ${activeTab === 'Rejected' ? 'active' : ''}" data-tab="Rejected">
              Rejected <span class="badge-count">${pc.rejected}</span>
            </button>
          </div>
        `;
      };

      const renderToolbar = () => {
        const portalOptions = portals.map(p => html`<option value="${p}" ${filters.portal === p ? safe('selected') : ''}>${p}</option>`);
        
        const hasActiveFilters = filters.text || filters.fit !== 'all' || filters.portal !== 'all' || filters.newOnly || Array.isArray(filters.hideLangs) || filters.remoteOnly || filters.sort !== 'score';
        
        return html`
          <div class="toolbar">
            <div class="filter-group">
              <span class="filter-label">Search</span>
              <input type="text" id="filter-text" placeholder="Title, company, city, skill... (press /)" value="${filters.text}"
                title='Words in any order · abbreviations (sr, dc, k8s) · typos fixed · "exact phrase" · -exclude'>
            </div>
            
            <div class="filter-group">
              <span class="filter-label">Fit Score</span>
              <select id="filter-fit">
                <option value="all" ${filters.fit === 'all' ? safe('selected') : ''}>All Fits</option>
                <option value="high" ${filters.fit === 'high' ? safe('selected') : ''}>High Only</option>
                <option value="medium" ${filters.fit === 'medium' ? safe('selected') : ''}>Medium Only</option>
              </select>
            </div>
            
            <div class="filter-group">
              <span class="filter-label">Source</span>
              <select id="filter-portal">
                <option value="all" ${filters.portal === 'all' ? safe('selected') : ''}>All Portals</option>
                ${safe(portalOptions.join(''))}
              </select>
            </div>
            
            <div class="filter-group">
              <span class="filter-label">Sort By</span>
              <select id="sort-by">
                <option value="score" ${filters.sort === 'score' ? safe('selected') : ''}>Best Match</option>
                <option value="date" ${filters.sort === 'date' ? safe('selected') : ''}>Newest First</option>
                <option value="company" ${filters.sort === 'company' ? safe('selected') : ''}>Company A-Z</option>
              </select>
            </div>

            <div class="filter-group">
              <span class="filter-label">Language req.</span>
              <button type="button" class="lang-btn" id="lang-btn" aria-haspopup="true" aria-expanded="false"
                title="Hide jobs that require a language you do not work in">
                <span class="lang-btn-text" id="lang-btn-text">${langButtonText()}</span>
                <span class="tab-chevron" aria-hidden="true"></span>
              </button>
            </div>

            <div class="checkboxes">
              <label class="checkbox-label">
                <input type="checkbox" id="filter-new" ${filters.newOnly ? safe('checked') : ''}> New only
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="filter-remote" ${filters.remoteOnly ? safe('checked') : ''}> Remote only
              </label>
            </div>

            <div class="toolbar-actions">
              <span style="font-size: 0.75rem; color: var(--fg-muted); margin-right: 0.5rem; user-select: none;">Right-click a card for actions</span>
              <button class="clear-filters ${hasActiveFilters ? 'visible' : ''}" id="btn-clear-filters">Clear all filters</button>
              <div class="results-count" id="results-count"></div>
            </div>
          </div>
        `;
      };

      const COUNTRY_LABELS = { PL: 'Poland', DE: 'Germany', NL: 'Netherlands', EU: 'EU Remote' };
      const COUNTRY_CODES = Object.keys(COUNTRY_LABELS);
      /** Always-first tab. Poland is the primary market and should never move. */
      const PINNED_COUNTRY = 'PL';

      /** Coarse country for a job, tolerating payloads written before country tagging. */
      const jobCountry = (j) => j.country || (j.region === 'PL' ? 'PL' : 'EU');

      /**
       * Job counts per country, excluding anything already in the pipeline
       * (those live in the Applied/Interview/Rejected tabs). `__all` is the
       * total across every country, for the All tab.
       */
      const countryCounts = () => {
        const out = { __all: 0 };
        for (const j of jobs) {
          if (stageOf(j)) continue;
          const c = jobCountry(j);
          out[c] = (out[c] || 0) + 1;
          out.__all++;
        }
        return out;
      };

      /**
       * Country tab order: the scope from the most recent scrape leads, so the
       * data you just pulled is what you see first. Remaining countries follow
       * by descending count, with an alphabetical tie-break so the bar does not
       * reshuffle between renders on equal counts.
       */
      /**
       * Every country the dashboard knows about, Poland pinned first and the
       * rest ordered by recency/size. Countries with zero jobs are deliberately
       * INCLUDED — you must be able to switch to Germany to see that it is
       * empty and then scrape it, rather than have it vanish from the UI.
       */
      const allCountryOptions = (counted) => {
        const ranked = orderedCountryTabs(counted).filter(c => c !== PINNED_COUNTRY);
        const rest = COUNTRY_CODES.filter(c => c !== PINNED_COUNTRY && !ranked.includes(c));
        return [PINNED_COUNTRY, ...ranked, ...rest];
      };

      const orderedCountryTabs = (counted) => {
        const present = Object.keys(counted).filter(k => k !== '__all' && counted[k] > 0);
        const lead = String(data.lastScope || '').toUpperCase();
        return present.sort((a, b) => {
          if (a === lead && b !== lead) return -1;
          if (b === lead && a !== lead) return 1;
          return (counted[b] - counted[a]) || a.localeCompare(b);
        });
      };

      let activeCountryMenu = null;
      /** Closes the country menu. Returns true if one was actually open. */
      const closeCountryMenu = () => {
        if (!activeCountryMenu) return false;
        activeCountryMenu.remove();
        activeCountryMenu = null;
        const b = document.getElementById('country-btn');
        if (b) b.setAttribute('aria-expanded', 'false');
        return true;
      };
      document.addEventListener('click', () => closeCountryMenu());
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCountryMenu(); });

      /** Languages hidden right now: your choice, or the profile-based default. */
      const hiddenLangs = () => new Set(Array.isArray(filters.hideLangs) ? filters.hideLangs : defaultHiddenLangs());
      /** [language, jobs requiring it] across the whole job list, most frequent first. */
      const langCounts = () => {
        const c = {};
        jobs.forEach(j => (j.languages || []).forEach(l => { c[l] = (c[l] || 0) + 1; }));
        return Object.entries(c).sort((a, b) => b[1] - a[1]);
      };
      const langButtonText = () => {
        const present = langCounts().map(([l]) => l);
        if (!present.length) return 'None detected';
        const hidden = present.filter(l => hiddenLangs().has(l));
        if (!hidden.length) return 'Show all';
        return 'Hide ' + (hidden.length <= 2 ? hidden.map(langLabel).join(', ') : langLabel(hidden[0]) + ' +' + (hidden.length - 1));
      };
      /** Jobs the last filter pass hid for their language alone (shown in the results line). */
      let lastLangHidden = 0;
      let activeLangMenu = null;
      /** Closes the language menu. Returns true if one was actually open. */
      const closeLangMenu = () => {
        if (!activeLangMenu) return false;
        activeLangMenu.remove();
        activeLangMenu = null;
        const b = document.getElementById('lang-btn');
        if (b) b.setAttribute('aria-expanded', 'false');
        return true;
      };
      document.addEventListener('click', () => closeLangMenu());
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLangMenu(); });
      const setHiddenLangs = (list) => {
        filters.hideLangs = list;
        saveFilters();
        const t = document.getElementById('lang-btn-text');
        if (t) t.textContent = langButtonText();
        updateJobsList();
      };

      const PIPELINE_TABS = { Applied: 'applied', Interview: 'interview', Rejected: 'rejected' };

      /**
       * The pipeline tabs are backed by job-states.json, NOT by the current
       * scrape. jobs.json only contains postings from the last N days, so a job
       * applied to three weeks ago drops out of the feed while its state entry
       * lives on. Rendering the pipeline from `jobs` alone made those
       * applications silently disappear after a scrape.
       *
       * We therefore union the feed with the persisted state DB, synthesising a
       * minimal card from the title/company the server recorded at the time the
       * stage was set.
       */
      const pipelineJobsFor = (stage) => {
        const byUrl = new Map();
        for (const j of jobs) {
          if (stageOf(j) === stage) byUrl.set(canonUrl(j.url), j);
        }
        for (const [cUrl, st] of Object.entries(jobStates)) {
          if (!st || st.state !== stage || byUrl.has(cUrl)) continue;
          byUrl.set(cUrl, {
            id: cUrl,
            url: cUrl,
            title: st.title || '(title not recorded)',
            company: st.company || '—',
            location: '—',
            portal: (() => { try { return new URL(cUrl).hostname.replace(/^www\./, ''); } catch { return '—'; } })(),
            region: 'PL',
            salary: null,
            date: null,
            contractTypes: [],
            workModes: [],
            remote: false,
            technologies: [],
            score: 0,
            fit: 'medium',
            matched: [],
            isNew: false,
            archived: true, // no longer in the current scrape window
          });
        }
        return [...byUrl.values()];
      };

      /** Counts for the pipeline tab badges, taken from the persisted DB. */
      const pipelineCounts = () => {
        const c = { applied: 0, interview: 0, rejected: 0 };
        for (const st of Object.values(jobStates)) {
          if (st && st.state && st.state in c) c[st.state]++;
        }
        return c;
      };

      /**
       * The search box. SmartFilter (smart-filter.js) understands word order,
       * accents, abbreviations, typos, role-family titles, "phrases" and
       * -exclusions; compiled once per query, then tested against every job.
       * The plain substring check is only a fallback if the script is missing.
       */
      let textMatcherCache = null;
      const textMatcherFor = (text) => {
        if (textMatcherCache && textMatcherCache.text === text && textMatcherCache.jobs === jobs) {
          return textMatcherCache.matcher;
        }
        const matcher = window.SmartFilter
          ? SmartFilter.compile(text, jobs)
          : {
              explain: [],
              test: (j) => ((j.title || '') + ' ' + (j.company || '')).toLowerCase().includes(text.toLowerCase()),
            };
        textMatcherCache = { text, jobs, matcher };
        return matcher;
      };

      // Abbreviations, spellings and role families for the search box. Optional:
      // without it the box still handles accents, word order, typos and quotes.
      if (window.SmartFilter) {
        fetch('keyword-map.json')
          .then((r) => (r.ok ? r.json() : null))
          .then((map) => {
            if (!map) return;
            SmartFilter.setVocabulary(map);
            textMatcherCache = null;
            if (filters.text) updateJobsList();
          })
          .catch(() => { /* vocabulary is an enhancement, not a requirement */ });
      }

      const getFilteredJobs = () => {
        const stage = PIPELINE_TABS[activeTab];
        const source = stage ? pipelineJobsFor(stage) : jobs;
        const text = filters.text ? textMatcherFor(filters.text) : null;

        const hiddenLangSet = hiddenLangs();
        let langHidden = 0;
        let result = source.filter(j => {
          const state = stageOf(j);

          if (state === 'deleted') return false;

          if (stage) {
            if (state !== stage) return false;
          } else {
            if (state === 'applied' || state === 'interview' || state === 'rejected') return false;
            
            // Country tabs. 'All' and the pipeline tabs are not country codes.
            if (COUNTRY_CODES.includes(activeTab) && jobCountry(j) !== activeTab) return false;
          }

          // Standard filtering
          if (text && !text.test(j)) return false;
          if (filters.fit !== 'all' && j.fit !== filters.fit) return false;
          if (filters.portal !== 'all' && j.portal !== filters.portal) return false;
          if (filters.newOnly && !j.isNew) return false;
          
          if (filters.remoteOnly) {
            const isExplicitRemote = !!j.remote;
            const modes = j.workModes || [];
            const hasRemoteMode = modes.some(m => {
              const mt = (m || '').toLowerCase();
              return mt.includes('zdalna') || mt.includes('remote');
            });
            if (!isExplicitRemote && !hasRemoteMode) return false;
          }

          // Last, so the count below only covers jobs hidden by language alone.
          if (hiddenLangSet.size && (j.languages || []).some(l => hiddenLangSet.has(l))) {
            langHidden++;
            return false;
          }
          
          return true;
        });

        lastLangHidden = langHidden;
        const effectiveSort = ((activeTab === 'Applied' || activeTab === 'Interview' || activeTab === 'Rejected') && filters.sort === 'score') ? 'appliedTime' : filters.sort;

        result.sort((a, b) => {
          if (effectiveSort === 'appliedTime') {
            const sa = stateFor(a);
            const sb = stateFor(b);
            const ta = sa && sa.at ? new Date(sa.at).getTime() : 0;
            const tb = sb && sb.at ? new Date(sb.at).getTime() : 0;
            return tb - ta;
          } else if (effectiveSort === 'score') {
            return (b.score || 0) - (a.score || 0);
          } else if (effectiveSort === 'date') {
            const da = a.date ? new Date(a.date).getTime() : 0;
            const db = b.date ? new Date(b.date).getTime() : 0;
            return db - da;
          } else if (effectiveSort === 'company') {
            return (a.company || '').localeCompare(b.company || '');
          }
          return 0;
        });

        return result;
      };

      /**
       * Every job currently on screen, keyed by canonical URL. Card event
       * handlers must resolve through this rather than through `jobs`: the
       * pipeline tabs also render entries reconstructed from job-states.json,
       * which are absent from the feed. Looking them up in `jobs` returned
       * undefined and silently dropped stage changes and note edits.
       */
      const renderedJobs = new Map();

      const findJobByUrl = (url) => renderedJobs.get(canonUrl(url)) || null;

      const renderJobsList = (filteredJobs) => {
        renderedJobs.clear();
        for (const j of filteredJobs) renderedJobs.set(canonUrl(j.url), j);
        if (activeTab === 'EU' && !euDismissed) {
          const explainer = html`
            <div class="banner info" id="eu-explainer">
              <div>
                These are EU-wide roles filtered to ones that appear performable from Poland. Roughly 70-80% of European postings advertised as 'remote' still require local tax residence, because otherwise the employer must register for Polish payroll/ZUS and takes on permanent-establishment risk. Each result below matched an explicit EU-remote signal, shown on the card. Non-EU markets (UK, Switzerland, Norway, US) are excluded by design. Always confirm B2B-from-Poland is acceptable before investing time.
              </div>
              <button class="banner-close" id="btn-dismiss-eu" title="Dismiss">×</button>
            </div>
          `;
          domJobsContainer.innerHTML = explainer; // Will append cards below
        } else {
          domJobsContainer.innerHTML = '';
        }

        if (filteredJobs.length === 0) {
          let emptyText = "No jobs match your current filters.";
          if (activeTab === 'EU') emptyText = "No EU-remote roles matched today. The filter is deliberately strict - see Portal Health below.";
          // A country can now be selected before it has ever been scraped, so
          // say how to populate it rather than just "no matches".
          if (COUNTRY_CODES.includes(activeTab) && !countryCounts()[activeTab]) {
            emptyText = "No " + (COUNTRY_LABELS[activeTab] || activeTab) + " jobs yet. Open the Scraper panel, set “Search in” to " + (COUNTRY_LABELS[activeTab] || activeTab) + ", and run a scrape.";
          }
          if (activeTab === 'Applied') emptyText = "Nothing marked as applied yet. Right-click a card and choose 'Mark as applied'.";
          if (activeTab === 'Interview') emptyText = "No jobs in interview stage yet.";
          if (activeTab === 'Rejected') emptyText = "No rejected jobs. Applications with no response for 14 days land here automatically, tagged IGNORED.";
          domJobsContainer.innerHTML += html`<div class="empty-state"><p>${emptyText}</p></div>`;
          return;
        }

        const cards = filteredJobs.map(job => {
          const fitClass = job.fit === 'high' ? 'fit-high' : (job.fit === 'medium' ? 'fit-medium' : 'fit-low');
          const fitBadgeClass = job.fit === 'high' ? 'badge-fit-high' : (job.fit === 'medium' ? 'badge-fit-medium' : 'badge-fit-low');
          
          const url = job.url || '#';
          const title = job.title || 'Unknown Title';
          const company = job.company || 'Unknown Company';
          const location = job.location || 'Unknown Location';
          
          const salaryHtml = job.salary 
            ? html`<div class="salary">${job.salary}</div>` 
            : html`<div class="salary muted">salary not disclosed</div>`;

          let matchedKeywordsHtml = '';
          const matched = job.matched || [];
          if (matched.length > 0) {
            const visible = matched.slice(0, 6);
            const extra = matched.length - 6;
            const chips = visible.map(k => html`<span class="chip matched">${k}</span>`);
            if (extra > 0) chips.push(html`<span class="chip matched">+${extra}</span>`);
            matchedKeywordsHtml = chips.join('');
          }

          let otherChipsHtml = '';
          const modesAndContracts = [...(job.workModes || []), ...(job.contractTypes || [])].filter(Boolean);
          if (modesAndContracts.length > 0) {
            otherChipsHtml = modesAndContracts.map(m => html`<span class="chip">${m}</span>`).join('');
          }

          let euExtrasHtml = '';
          if (job.region === 'EU') {
            if (job.euEvidence) {
              euExtrasHtml += html`<span class="chip eu-evidence">EU-remote: ${job.euEvidence}</span>`;
            }
          }

          // One chip per required language; the tooltip quotes the line that says so.
          const langReqs = Array.isArray(job.languageReqs) ? job.languageReqs
            : (job.languages || []).map(l => ({ lang: l, how: 'required', evidence: '' }));
          const langChipsHtml = langReqs.map(r => html`<span class="chip lang-req" title="${r.evidence || ''}">${r.how === 'posting' ? 'Written in ' + langLabel(r.lang) : langLabel(r.lang) + ' required'}</span>`).join('');

          
          const cUrl = canonUrl(url);
          const stateInfo = stateFor(job);
          const jobState = stateInfo ? stateInfo.state : null;
          const jobNote = stateInfo ? stateInfo.note : '';
          
          let cardClasses = 'job-card ' + fitClass;
          let extraBadgesHtml = '';
          if (jobState === 'applied') {
            cardClasses += ' is-applied';
            extraBadgesHtml = html`<span class="badge badge-applied">APPLIED ${getRelativeTime(stateInfo.at)}</span>`;
          } else if (jobState === 'interview') {
            cardClasses += ' is-interview';
            extraBadgesHtml = html`<span class="badge badge-interview">INTERVIEW ${getRelativeTime(stateInfo.at)}</span>`;
          } else if (jobState === 'rejected') {
            cardClasses += ' is-rejected';
            if (stateInfo && stateInfo.autoRejected) {
              // Auto-closed by the 14-day no-response sweep, not an actual
              // rejection — label it differently so the distinction is obvious.
              const appliedAgo = stateInfo.appliedAt ? getRelativeTime(stateInfo.appliedAt) : null;
              extraBadgesHtml = html`<span class="badge badge-ignored" title="No response within 14 days of applying, so this was closed automatically. Move it back to Applied to restart the clock.">IGNORED${appliedAgo ? ' — applied ' + appliedAgo : ''}</span>`;
            } else {
              extraBadgesHtml = html`<span class="badge badge-rejected">REJECTED ${getRelativeTime(stateInfo.at)}</span>`;
            }
          }

          return html`
            <div class="${cardClasses}" data-url="${url}">
              <div class="job-header">
                <a href="${url}" target="_blank" rel="noopener noreferrer" class="job-title">${title}</a>
                <div class="job-meta">
                  <span>${company}</span> • <span>${location}</span>
                </div>
              </div>

              <div class="badges-row">
                ${safe(extraBadgesHtml)}
                ${job.archived ? safe(html`<span class="badge badge-archived" title="This posting is older than the current scrape window; details are from when you saved it.">ARCHIVED</span>`) : ''}
                ${job.portal ? safe(html`<span class="badge badge-portal">${job.portal}</span>`) : ''}
                ${(!job.archived && job.fit) ? safe(html`<span class="badge ${fitBadgeClass}">${job.fit} fit</span>`) : ''}
                ${job.archived ? '' : safe(html`<span class="badge badge-score">Score: ${job.score || 0}</span>`)}
                ${job.isNew ? safe(html`<span class="badge badge-new">NEW</span>`) : ''}
                ${job.date ? safe(html`<span class="badge badge-date">${getRelativeTime(job.date)}</span>`) : ''}
              </div>
              
              ${job.archived ? '' : safe(salaryHtml)}

              <div class="chips-row">
                ${safe(euExtrasHtml)}
                ${safe(langChipsHtml)}
                ${safe(otherChipsHtml)}
                ${safe(matchedKeywordsHtml)}
              </div>
              <div class="job-actions" style="display: flex; gap: 0.5rem; margin-top: 0.75rem; align-items: stretch; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 0.75rem;">
                <select class="job-stage-select" data-url="${url}" style="flex: 0 0 auto;">
                  <option value="" ${!jobState ? safe('selected') : ''}>Not Applied</option>
                  <option value="applied" ${jobState === 'applied' ? safe('selected') : ''}>Applied</option>
                  <option value="interview" ${jobState === 'interview' ? safe('selected') : ''}>Interview</option>
                  <option value="rejected" ${jobState === 'rejected' ? safe('selected') : ''}>Rejected</option>
                </select>
                <input type="text" class="job-note-input" data-url="${url}" placeholder="Add a note (Enter to save)..." value="${jobNote || ''}" style="flex: 1; min-width: 200px;">

              </div>
            </div>
          `;
        });

        domJobsContainer.innerHTML += html`<div class="jobs-grid">${safe(cards.join(''))}</div>`;

        // Bind EU dismiss
        const dismissBtn = document.getElementById('btn-dismiss-eu');
        if (dismissBtn) {
          dismissBtn.addEventListener('click', () => {
            euDismissed = true;
            saveEuDismissed();
            updateJobsList();
          });
        }
      };

      const renderHealth = () => {
        if (!health || health.length === 0) return '';
        
        // Group by portal
        const grouped = {};
        health.forEach(h => {
          const p = h.portal || 'unknown';
          if (!grouped[p]) grouped[p] = [];
          grouped[p].push(h);
        });

        const cards = Object.keys(grouped).sort().map(portal => {
          const checks = grouped[portal];
          const items = checks.map(h => {
            const status = (h.status || '').toLowerCase();
            const statusClass = status.includes('error') ? 'status-error' : (status.includes('disabled') ? 'status-disabled' : 'status-ok');
            return html`
              <div class="health-item">
                <div class="health-item-top">
                  <span class="health-query">${h.query || '-'}</span>
                  <span class="health-status ${statusClass}">${h.status || '-'}</span>
                </div>
                <div class="health-meta">
                  <span>${h.region || 'PL'}</span> • 
                  <span>${h.location || '-'}</span> • 
                  <span>${h.count != null ? h.count + ' jobs' : '-'}</span>
                </div>
              </div>
            `;
          });
          return html`
            <div class="health-card">
              <h3>${portal}</h3>
              ${safe(items.join(''))}
            </div>
          `;
        });

        return html`
          <details class="health-section">
            <summary>Portal Health (${health.length} checks)</summary>
            <div class="health-grid">
              ${safe(cards.join(''))}
            </div>
          </details>
        `;
      };

      // Main Render Core
      let domJobsContainer = null;
      let domResultsCount = null;

      const initUI = () => {
        // A country tab only renders when it has jobs, so a saved/auto-selected
        // tab whose country is now empty would leave nothing highlighted and an
        // empty list. Fall back to the leading country, else All.
        // Every configured country is selectable now, including empty ones, so
        // there is nothing to bounce off — only an unknown code needs a fallback.
        if (activeTab !== 'All' && !PIPELINE_TABS[activeTab] && !COUNTRY_CODES.includes(activeTab)) {
          activeTab = PINNED_COUNTRY;
          saveTab();
        }

        try {
          app.innerHTML = html`
            <div class="page-header">
              ${safe(renderHeader())}
            </div>
            <div class="sticky-top">
              ${safe(renderTabs())}
              ${safe(renderToolbar())}
            </div>
            <div class="main-content">
              <div id="jobs-container"></div>
              ${safe(renderHealth())}
            </div>
          `;

          domJobsContainer = document.getElementById('jobs-container');
          domResultsCount = document.getElementById('results-count');
          
          updateJobsList();
          bindEvents();
          if (isHttp) {
            bindAPIEvents();
          }
        } catch (err) {
          app.innerHTML = html`
            <div class="main-content" style="padding-top: 2rem;">
              <div class="empty-state" style="border-color: var(--error);">
                <h2 style="color: var(--error)">Render Error</h2>
                <p>Failed to render the dashboard.</p>
                <code>${err.message}</code>
              </div>
            </div>
          `;
        }
      };

      const updateJobsList = () => {
        const counted = countryCounts();
        counts.total = counted.__all;
        // Kept for the legacy header text; the tabs themselves are per-country.
        counts.pl = counted.PL || 0;
        counts.eu = counted.EU || 0;

        // Pipeline totals come from the persisted DB, so applications stay
        // counted even once the posting has aged out of the scrape window.
        const pc = pipelineCounts();
        counts.applied = pc.applied;
        counts.interview = pc.interview;
        counts.rejected = pc.rejected;

        // Country badges are data-driven now, so update whichever tabs exist
        // rather than a fixed PL/EU pair.
        for (const code of COUNTRY_CODES) {
          const el = document.querySelector('.tab[data-tab="' + code + '"] .badge-count');
          if (el) el.textContent = counted[code] || 0;
        }
        const bAll = document.querySelector('.tab[data-tab="All"] .badge-count'); if (bAll) bAll.textContent = counts.total;
        const bApp = document.querySelector('.tab[data-tab="Applied"] .badge-count'); if (bApp) bApp.textContent = counts.applied;
        const bInt = document.querySelector('.tab[data-tab="Interview"] .badge-count'); if (bInt) bInt.textContent = counts.interview;
        const bRej = document.querySelector('.tab[data-tab="Rejected"] .badge-count'); if (bRej) bRej.textContent = counts.rejected;

        const sortBySelect = document.getElementById('sort-by');
        if (sortBySelect) {
          const scoreOption = sortBySelect.querySelector('option[value="score"]');
          if (scoreOption) {
            scoreOption.textContent = (activeTab === 'Applied' || activeTab === 'Interview' || activeTab === 'Rejected') ? 'Application Time' : 'Best Match';
          }
        }

        const filtered = getFilteredJobs();
        renderJobsList(filtered);
        
        const totalForTab = COUNTRY_CODES.includes(activeTab)
          ? (counted[activeTab] || 0)
          : (activeTab === 'Applied' ? counts.applied
            : activeTab === 'Interview' ? counts.interview
            : activeTab === 'Rejected' ? counts.rejected
            : counts.total);
        
        const suffix = (activeTab === 'Applied' || activeTab === 'Interview' || activeTab === 'Rejected') ? ' in this stage' : '';
        // Say how the search box read the query (abbreviations, typo fixes,
        // related titles), so a broader result set is never a mystery.
        const understood = filters.text ? textMatcherFor(filters.text).explain.join(' · ') : '';
        domResultsCount.textContent = 'Showing ' + filtered.length + ' of ' + totalForTab + suffix + (lastLangHidden ? ' · ' + lastLangHidden + ' hidden by language' : '') + (understood ? ' — ' + understood : '');
        domResultsCount.title = understood ? 'Search understood: ' + understood : '';

        // Toggle clear filters button
        const btnClear = document.getElementById('btn-clear-filters');
        if (btnClear) {
          const hasActiveFilters = filters.text || filters.fit !== 'all' || filters.portal !== 'all' || filters.newOnly || Array.isArray(filters.hideLangs) || filters.remoteOnly || filters.sort !== 'score';
          btnClear.classList.toggle('visible', !!hasActiveFilters);
        }
      };

      const bindEvents = () => {
        // Tab clicks
        document.querySelectorAll('.tab').forEach(btn => {
          // The country dropdown is styled as a tab but carries no data-tab;
          // it manages its own selection below.
          if (!btn.dataset.tab) return;
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const target = e.currentTarget;
            target.classList.add('active');
            activeTab = target.dataset.tab;
            saveTab();
            updateJobsList();
          });
        });

        // Country menu. Themed rather than a native <select> so it matches the
        // dashboard in both colour schemes; the OS-drawn option list could not
        // be styled and looked wrong on the dark theme.
        const countryBtn = document.getElementById('country-btn');
        if (countryBtn) {
          countryBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (closeCountryMenu()) return; // second click closes it
            closeLangMenu();

            const counted = countryCounts();
            const ordered = allCountryOptions(counted);

            const menu = document.createElement('div');
            menu.className = 'country-menu';
            menu.setAttribute('role', 'menu');

            ordered.forEach(code => {
              const item = document.createElement('button');
              item.className = 'country-menu-item'
                + (code === activeTab ? ' is-current' : '')
                + (!counted[code] ? ' is-empty' : '');
              item.setAttribute('role', 'menuitem');
              item.innerHTML =
                '<span class="country-menu-label"></span><span class="badge-count"></span>';
              item.querySelector('.country-menu-label').textContent = COUNTRY_LABELS[code] || code;
              item.querySelector('.badge-count').textContent = counted[code] || 0;
              item.onclick = (ev) => {
                ev.stopPropagation();
                closeCountryMenu();
                activeTab = code;
                saveTab();
                initUI();
              };
              menu.appendChild(item);
            });

            document.body.appendChild(menu);
            activeCountryMenu = menu;
            countryBtn.setAttribute('aria-expanded', 'true');

            // Anchor under the button, flipping left if it would overflow.
            const r = countryBtn.getBoundingClientRect();
            const mr = menu.getBoundingClientRect();
            let x = r.left;
            if (x + mr.width > window.innerWidth - 8) x = window.innerWidth - mr.width - 8;
            menu.style.left = Math.max(8, x) + 'px';
            menu.style.top = (r.bottom + 4) + 'px';
          });
        }

        // Form bindings
        const bindInput = (id, prop, isCheckbox = false) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.addEventListener('change', (e) => {
            filters[prop] = isCheckbox ? e.target.checked : e.target.value;
            saveFilters();
            updateJobsList();
          });
          if (!isCheckbox && el.tagName === 'INPUT') {
            el.addEventListener('input', (e) => {
              filters[prop] = e.target.value;
              saveFilters();
              updateJobsList();
            });
          }
        };

        bindInput('filter-text', 'text');
        bindInput('filter-fit', 'fit');
        bindInput('filter-portal', 'portal');
        bindInput('filter-new', 'newOnly', true);
        bindInput('filter-remote', 'remoteOnly', true);
        bindInput('sort-by', 'sort');

        // Language menu: a checklist of the languages jobs in this list require.
        // Ticking a box hides every job that requires that language.
        const langBtn = document.getElementById('lang-btn');
        if (langBtn) {
          langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (closeLangMenu()) return; // second click closes it
            closeCountryMenu();

            const menu = document.createElement('div');
            menu.className = 'country-menu lang-menu';
            menu.setAttribute('role', 'group');
            menu.setAttribute('aria-label', 'Hide jobs that require');
            menu.addEventListener('click', (ev) => ev.stopPropagation()); // ticking boxes keeps it open

            const head = document.createElement('div');
            head.className = 'lang-menu-head';
            head.textContent = 'Hide jobs that require';
            menu.appendChild(head);

            const counts = langCounts();
            const hidden = hiddenLangs();
            if (!counts.length) {
              const empty = document.createElement('div');
              empty.className = 'lang-menu-empty';
              empty.textContent = 'No job in this list requires a language other than English.';
              menu.appendChild(empty);
            }
            const boxes = [];
            counts.forEach(([lang, n]) => {
              const row = document.createElement('label');
              row.className = 'lang-menu-item';
              row.innerHTML = '<input type="checkbox"><span class="lang-menu-label"></span><span class="badge-count"></span>';
              const box = row.querySelector('input');
              box.checked = hidden.has(lang);
              row.querySelector('.lang-menu-label').textContent = langLabel(lang);
              row.querySelector('.badge-count').textContent = n;
              box.addEventListener('change', () => {
                const s = hiddenLangs();
                if (box.checked) s.add(lang); else s.delete(lang);
                setHiddenLangs([...s]);
              });
              boxes.push([lang, box]);
              menu.appendChild(row);
            });
            if (counts.length) {
              const actions = document.createElement('div');
              actions.className = 'lang-menu-actions';
              const showAll = document.createElement('button');
              showAll.type = 'button';
              showAll.textContent = 'Show all';
              showAll.onclick = () => {
                setHiddenLangs([]);
                boxes.forEach(([, b]) => { b.checked = false; });
              };
              const reset = document.createElement('button');
              reset.type = 'button';
              reset.textContent = 'Default';
              reset.title = 'Hide the languages your profile does not list';
              reset.onclick = () => {
                setHiddenLangs(null);
                const d = hiddenLangs();
                boxes.forEach(([l, b]) => { b.checked = d.has(l); });
              };
              actions.append(showAll, reset);
              menu.appendChild(actions);
            }

            document.body.appendChild(menu);
            activeLangMenu = menu;
            langBtn.setAttribute('aria-expanded', 'true');
            // Anchor under the button, flipping left if it would overflow.
            const r = langBtn.getBoundingClientRect();
            const mr = menu.getBoundingClientRect();
            let x = r.left;
            if (x + mr.width > window.innerWidth - 8) x = window.innerWidth - mr.width - 8;
            menu.style.left = Math.max(8, x) + 'px';
            menu.style.top = (r.bottom + 4) + 'px';
          });
        }

        // Clear filters
        const btnClear = document.getElementById('btn-clear-filters');
        if (btnClear) {
          btnClear.addEventListener('click', () => {
            filters = { ...defaultFilters };
            saveFilters();
            // sync DOM
            document.getElementById('filter-text').value = '';
            document.getElementById('filter-fit').value = 'all';
            document.getElementById('filter-portal').value = 'all';
            document.getElementById('sort-by').value = 'score';
            document.getElementById('filter-new').checked = false;
            document.getElementById('lang-btn-text').textContent = langButtonText();
            document.getElementById('filter-remote').checked = false;
            updateJobsList();
          });
        }

        // Clickable cards
        if (domJobsContainer) {
          domJobsContainer.addEventListener('change', (e) => {
            if (e.target.classList.contains('job-stage-select')) {
              const url = e.target.dataset.url;
              const job = findJobByUrl(url);
              if (job) {
                const stateVal = e.target.value || null;
                setJobState(job, stateVal, undefined);
              }
            }
          });

          const handleNoteSave = (input) => {
            const url = input.dataset.url;
            const job = findJobByUrl(url);
            if (!job) return;
            const stateInfo = stateFor(job);
            const currentNote = stateInfo ? stateInfo.note : '';
            const newNote = input.value.trim();
            if (newNote !== (currentNote || '')) {
              setJobState(job, undefined, newNote);
              showToast('Note saved');
            }
          };

          domJobsContainer.addEventListener('blur', (e) => {
            if (e.target.classList.contains('job-note-input')) {
              handleNoteSave(e.target);
            }
          }, true);

          domJobsContainer.addEventListener('keydown', (e) => {
            if (!e.target.classList.contains('job-note-input')) return;
            // Plain Enter saves. It previously required Ctrl/Cmd+Enter, so the
            // only discoverable way to commit a note was to click outside the
            // box. Shift+Enter is left alone for anyone used to it as newline.
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              e.target.blur(); // blur handler performs the save
            } else if (e.key === 'Escape') {
              // Abandon the edit and restore the stored value.
              const job = findJobByUrl(e.target.dataset.url);
              const st = job ? stateFor(job) : null;
              e.target.value = (st && st.note) || '';
              e.target.blur();
            }
          });


          domJobsContainer.addEventListener('click', (e) => {
            const card = e.target.closest('.job-card');
            if (!card) return;
            // Ignore interactive elements
            if (e.target.closest('a, button, input, label, select, textarea')) return;
            // Ignore if user is selecting text
            if (window.getSelection().toString().length > 0) return;
            
            const url = card.dataset.url;
            if (url && url !== '#') {
              window.open(url, '_blank');
            }
          });

          // Context menu
          domJobsContainer.addEventListener('contextmenu', (e) => {
            const card = e.target.closest('.job-card');
            if (!card) return;
            e.preventDefault();
            closeContextMenu();

            const url = card.dataset.url;
            const job = findJobByUrl(url);
            if (!job) return;

            const currentState = stageOf(job);

            const menu = document.createElement('div');
            menu.className = 'context-menu';
            menu.setAttribute('role', 'menu');

            const createItem = (text, onClick, variant = 'neutral') => {
              const btn = document.createElement('button');
              btn.className = 'context-menu-item ctx-' + variant;
              btn.setAttribute('role', 'menuitem');
              btn.textContent = text;
              btn.onclick = (ev) => {
                ev.stopPropagation();
                closeContextMenu();
                onClick();
              };
              menu.appendChild(btn);
              return btn;
            };

            // Navigation first: opening the posting and grabbing its link are the
            // actions used most often and are non-destructive, so they sit at the
            // top where the pointer already is. The pipeline actions (which mutate
            // saved state, including the destructive delete) follow the separator.
            createItem('Open posting', () => {
              window.open(job.url, '_blank');
            }, 'neutral');
            createItem('Copy link', () => {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(job.url).then(() => showToast('Link copied'));
              } else {
                const ta = document.createElement('textarea');
                ta.value = job.url;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); showToast('Link copied'); } catch(err) {}
                document.body.removeChild(ta);
              }
            }, 'neutral');

            const sep = document.createElement('div');
            sep.className = 'context-menu-separator';
            menu.appendChild(sep);

            createItem(currentState === 'applied' ? 'Unmark as applied' : 'Mark as applied', () => {
              setJobState(job, currentState === 'applied' ? null : 'applied', undefined);
            }, 'applied');
            if (currentState !== 'interview') {
              createItem('Move to Interview', () => { setJobState(job, 'interview', undefined); }, 'interview');
            }
            if (currentState !== 'rejected') {
              createItem('Move to Rejected', () => { setJobState(job, 'rejected', undefined); }, 'rejected');
            }
            createItem('Delete notification', () => {
              setJobState(job, 'deleted', undefined);
              showToast('Deleted', () => setJobState(job, null, undefined));
            }, 'danger');

            document.body.appendChild(menu);
            activeContextMenu = menu;

            let x = e.clientX;
            let y = e.clientY;
            const rect = menu.getBoundingClientRect();
            if (x + rect.width > window.innerWidth) x -= rect.width;
            if (y + rect.height > window.innerHeight) y -= rect.height;
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';

            const items = Array.from(menu.querySelectorAll('.context-menu-item'));
            if (items.length > 0) items[0].focus();

            menu.addEventListener('keydown', (ev) => {
              const idx = items.indexOf(document.activeElement);
              if (ev.key === 'ArrowDown') {
                ev.preventDefault();
                items[(idx + 1) % items.length].focus();
              } else if (ev.key === 'ArrowUp') {
                ev.preventDefault();
                items[(idx - 1 + items.length) % items.length].focus();
              }
            });
          });
        }

        // Context Menu State and global close handlers
        let activeContextMenu = null;
        const closeContextMenu = () => {
          if (activeContextMenu) {
            activeContextMenu.remove();
            activeContextMenu = null;
          }
        };

        document.addEventListener('click', closeContextMenu);
        window.addEventListener('resize', closeContextMenu);
        window.addEventListener('scroll', closeContextMenu, true);

        // Global Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeContextMenu();
          
          const searchInput = document.getElementById('filter-text');
          if (!searchInput) return;
          
          if (e.key === '/' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            searchInput.focus();
          } else if (e.key === 'Escape' && document.activeElement === searchInput) {
            searchInput.value = '';
            filters.text = '';
            saveFilters();
            updateJobsList();
            searchInput.blur();
          }
        });
      };

      const bindAPIEvents = () => {
        // CV Upload
        const cvInput = document.getElementById('cv-upload-input');
        const cvDropzone = document.getElementById('cv-dropzone');
        const cvPanel = document.getElementById('cv-panel');

        const handleCVFile = async (file) => {
          if (!file) return;
          cvPanel.innerHTML = renderCVContent('Uploading...', '');
          
          const formData = new FormData();
          formData.append('cv', file);
          
          try {
            const res = await fetch('/api/cv', { method: 'POST', body: formData });
            const result = await res.json();
            
            if (!res.ok) {
              document.getElementById('cv-panel').innerHTML = renderCVContent(result.error || 'Upload failed', 'error');
            } else {
              data.cv = result.cv;
              document.getElementById('cv-panel').innerHTML = renderCVContent('Successfully uploaded', 'success');
              // Remove success message after a bit
              setTimeout(() => {
                const panel = document.getElementById('cv-panel');
                if (panel) panel.innerHTML = renderCVContent();
                bindCVInput(); // rebind
              }, 3000);
            }
          } catch (e) {
            document.getElementById('cv-panel').innerHTML = renderCVContent(e.message, 'error');
          }
          bindCVInput(); // rebind events on the newly injected HTML
        };

        // window.JOBS.cv is only a snapshot taken at the last scrape, so a CV
        // uploaded since then would not show after a reload. Ask the server for
        // the authoritative record. Best-effort: failure just leaves the
        // snapshot value in place.
        const refreshCVFromServer = async () => {
          try {
            const res = await fetch('/api/cv');
            if (!res.ok) return;
            const body = await res.json();
            if (!body || body.current === undefined) return;
            data.cv = body.current;
            const panel = document.getElementById('cv-panel');
            if (panel) {
              panel.innerHTML = renderCVContent();
              bindCVInput();
            }
          } catch (e) {
            /* server not running - keep the snapshot */
          }
        };

        const bindCVInput = () => {
          const input = document.getElementById('cv-upload-input');
          const dropzone = document.getElementById('cv-dropzone');
          if (!input || !dropzone) return;


          input.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            // Clear the value so picking the SAME file again still fires
            // 'change'. Without this, re-uploading a corrected CV that kept its
            // filename appeared to do nothing at all.
            e.target.value = '';
            if (file) handleCVFile(file);
          });

          dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
          });
          dropzone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
          });
          dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
              handleCVFile(e.dataTransfer.files[0]);
            }
          });
        };
        bindCVInput();
        if (isHttp) refreshCVFromServer();

        const bindScrape = () => {
          // The panel is shared. When Smart Search owns it, its own wiring
          // applies and none of the Scraper controls exist.
          if (smartState.open) { bindSmart(); return; }
          bindSmartToggle();
          const btn = document.getElementById('btn-scrape');
          const input = document.getElementById('scrape-jobage');


          // Keep the plain-English hint in sync with the number the user picked,
          // so "how old a post may be" is never ambiguous.
          if (input) {
            input.addEventListener('input', () => {
              const el = document.getElementById('scrape-hint-days');
              if (el) el.textContent = input.value || lastJobage;
            });

            // Clicking the field empties it so a new value can be typed straight
            // away instead of having to select/delete the existing digit first.
            // The old value is remembered and restored on blur, so clicking in
            // and then clicking away can never leave the field blank (which
            // would otherwise silently fall back to the default on submit).
            let lastJobage = input.value || '7';
            input.addEventListener('focus', () => {
              lastJobage = input.value || lastJobage;
              input.value = '';
            });
            input.addEventListener('blur', () => {
              if (input.value === '') {
                input.value = lastJobage;
                const el = document.getElementById('scrape-hint-days');
                if (el) el.textContent = lastJobage;
              }
            });
          }

          const scopeSel = document.getElementById('scrape-scope');
          if (scopeSel) {
            scopeSel.addEventListener('change', () => {
              scrapeScope = scopeSel.value;
              saveScrapeScope();
            });
          }

          if (!btn) return;
          btn.addEventListener('click', async () => {
            const jobage = document.getElementById('scrape-jobage').value || 7;
            const scope = (document.getElementById('scrape-scope') || {}).value || scrapeScope;
            try {
              scrapeState.running = true;
              scrapeState.startedAt = new Date().toISOString();
              scrapeState.error = null;
              scrapeState.exitCode = null;
              scrapeState.progress = { done: 0, total: 0, percent: 0, label: 'Starting…' };
              document.getElementById('scrape-panel').innerHTML = renderScrapeContent();
              
              const res = await fetch('/api/scrape?jobage=' + jobage + '&scope=' + encodeURIComponent(scope), { method: 'POST' });
              if (res.status === 409) {
                // Already running, just start polling
                startScrapePoll();
                return;
              }
              if (!res.ok) {
                const errData = await res.json().catch(()=>({}));
                throw new Error(errData.error || 'HTTP ' + res.status);
              }
              startScrapePoll();
            } catch (e) {
              scrapeState.running = false;
              scrapeState.error = e.message;
              document.getElementById('scrape-panel').innerHTML = renderScrapeContent();
              bindScrape();
            }
          });

          bindScrapeCancel();
        };

        /**
         * Cancel is rendered by both the Scraper and Smart Search views (same
         * id, never both at once), so both bind functions call this.
         */
        const bindScrapeCancel = () => {
          const cancelBtn = document.getElementById('btn-scrape-cancel');
          if (cancelBtn) {
            cancelBtn.addEventListener('click', async () => {
              cancelBtn.disabled = true;
              try {
                await fetch('/api/scrape/cancel', { method: 'POST' });
              } catch (e) {
                scrapeState.error = 'Cancel failed: ' + e.message;
              }
              // Pull the authoritative state back rather than assuming.
              try {
                const s = await fetch('/api/scrape').then(r => r.json());
                scrapeState.running = s.running;
                scrapeState.exitCode = s.exitCode;
                scrapeState.progress = s.progress;
              } catch { /* poll will correct it */ }
              document.getElementById('scrape-panel').innerHTML = renderScrapeContent();
              bindScrape();
            });
          }
        };

        // -------------------------------------------------------------------
        // Smart Search wiring. Mirrors bindScrape(): the panel is re-rendered
        // wholesale via innerHTML, so listeners are re-attached after each
        // render rather than delegated.
        // -------------------------------------------------------------------
        const rerenderSmart = () => {
          const p = document.getElementById('scrape-panel');
          if (!p) return;
          // Focus survives the innerHTML swap only if it is explicitly restored.
          // Track it here rather than in the add handler alone, because async
          // expansion triggers a SECOND re-render a moment later which would
          // otherwise steal the cursor back out of the box.
          const active = document.activeElement;
          const hadFocus = !!active && active.id === 'smart-input';
          const caret = hadFocus ? active.selectionStart : null;
          const typed = hadFocus ? active.value : null;

          // The panel is re-rendered by replacing innerHTML, which momentarily
          // collapses its height to zero. The browser clamps the scroll offset
          // to the now-shorter document, so the page visibly jumps to the top on
          // every keyword added. Capture the offset and restore it after the DOM
          // settles.
          const y = window.scrollY;
          const h = p.offsetHeight;
          p.style.minHeight = h + 'px';
          // Render through renderScrapeContent, not renderSmartContent: the two
          // views share this panel and it is what decides which one is showing.
          // Rendering Smart directly meant toggling back to the Scraper drew the
          // Smart Search markup again and the switch only ever worked one way.
          p.innerHTML = renderScrapeContent();
          bindScrape();

          p.style.minHeight = '';
          if (window.scrollY !== y) window.scrollTo({ top: y, behavior: 'instant' });

          const input = document.getElementById('smart-input');
          if (input && (hadFocus || smartState.refocus)) {
            // After an add the box is cleared; mid-typing re-renders keep what
            // was typed and the caret position.
            if (smartState.refocus) {
              smartState.refocus = false;
              input.value = '';
            } else if (typed !== null) {
              input.value = typed;
              if (caret !== null) {
                try { input.setSelectionRange(caret, caret); } catch (e) { /* ignore */ }
              }
            }
            input.focus();
          }
        };


        const smartExpand = async (kw) => {
          // Deselections survive a re-expansion (LLM toggle, engine upgrade) for
          // every term the new expansion still contains.
          const prevOff = (smartState.expansions[kw] && smartState.expansions[kw].off) || new Set();
          smartState.expansions[kw] = { expanding: true, terms: null, off: prevOff, engine: 0 };
          rerenderSmart();
          try {
            const url = '/api/keywords/expand?q=' + encodeURIComponent(kw) +
                        (smartState.useLlm ? '&llm=1' : '');
            const res = await fetch(url);
            if (!res.ok) {
              const e = await res.json().catch(() => ({}));
              throw new Error(e.error || 'HTTP ' + res.status);
            }
            const data = await res.json();
            smartState.llmAvailable = !!data.llmAvailable;
            const terms = data.terms || [];
            const off = new Set([...prevOff].filter(t => terms.some(x => x.term === t)));
            smartState.expansions[kw] = { expanding: false, terms, off, engine: data.engine || 1 };
            smartState.error = null;
          } catch (e) {
            smartState.expansions[kw] = { expanding: false, terms: [{ term: kw, reason: 'expansion failed', source: 'original' }], off: new Set(), engine: 0 };
            smartState.error = 'Could not expand "' + kw + '": ' + e.message;
          }
          smartSave();

          rerenderSmart();
        };

        const smartLoadCv = async () => {
          smartState.cvLoading = true;
          rerenderSmart();
          try {
            const res = await fetch('/api/cv/keywords');
            smartState.cv = await res.json();
          } catch (e) {
            smartState.cv = { empty: true, keywords: [] };
            smartState.error = 'Could not read CV keywords: ' + e.message;
          }
          smartState.cvLoading = false;
          rerenderSmart();
        };

        const smartAddKeyword = (raw) => {
          const kw = String(raw || '').trim();
          if (!kw) return;
          if (smartState.keywords.includes(kw)) {
            smartState.error = '"' + kw + '" is already in the list.';
            rerenderSmart();
            return;
          }
          smartState.error = null;
          smartState.keywords.push(kw);
          // smartExpand re-renders the panel, which replaces the input element,
          // so focus has to be restored explicitly or every add costs a click.
          smartState.refocus = true;
          smartSave();
          smartExpand(kw);
        };



        /**
         * Wire the Scraper <-> Smart Search switch.
         *
         * The button exists in BOTH panel headers, so this is called from
         * bindScrape and bindSmart alike — whichever view currently owns the
         * shared panel.
         */
        const bindSmartToggle = () => {
          const toggle = document.getElementById('smart-toggle');
          if (!toggle) return;
          toggle.addEventListener('click', () => {
            smartState.open = !smartState.open;
            smartState.collapsed = false;
            smartSave();
            rerenderSmart();
            // The CV list is fetched once, the first time Smart Search is
            // opened, so the Scraper view costs nothing on page load.
            if (smartState.open && !smartState.cv && !smartState.cvLoading) smartLoadCv();
          });
        };

        const bindSmart = () => {
          const panel = document.getElementById('scrape-panel');
          if (!panel) return;

          bindSmartToggle();
          if (!smartState.open) return;
          bindScrapeCancel();

          const expand = document.getElementById('smart-expand');
          if (expand) {
            expand.addEventListener('click', () => {
              smartState.collapsed = false;
              rerenderSmart();
            });
          }
          if (smartState.collapsed) return;


          const clear = document.getElementById('smart-clear');
          if (clear) {
            clear.addEventListener('click', () => {
              if (!confirm('Remove all ' + smartState.keywords.length + ' keywords?')) return;
              smartState.keywords = [];
              smartState.expansions = {};
              smartState.error = null;
              smartSave();
              rerenderSmart();
            });
          }


          const input = document.getElementById('smart-input');
          const addBtn = document.getElementById('smart-add');
          if (addBtn && input) {
            addBtn.addEventListener('click', () => { smartAddKeyword(input.value); });
          }
          if (input) {
            input.addEventListener('keydown', (ev) => {
              if (ev.key !== 'Enter') return;
              ev.preventDefault();
              smartAddKeyword(input.value);
            });
          }



          const llm = document.getElementById('smart-llm');
          const ageInput = document.getElementById('smart-jobage');
          const scopeSel = document.getElementById('smart-scope');
          if (scopeSel) {
            // Re-render so native-language chips for markets outside the new
            // scope are dimmed and the search count is right.
            scopeSel.addEventListener('change', () => {
              smartState.scope = scopeSel.value;
              smartSave();
              rerenderSmart();
            });
          }
          if (ageInput) {
            ageInput.addEventListener('input', () => {
              const n = Number(ageInput.value);
              if (!Number.isInteger(n) || n < 1 || n > 30) return; // mid-edit / out of range: keep last good value
              smartState.jobage = n;
              smartSave();
            });
          }
          if (llm) {
            llm.addEventListener('change', () => {
              smartState.useLlm = llm.checked;
              smartSave();
              // Re-expand everything so the displayed list matches the setting.
              smartState.keywords.forEach(smartExpand);
            });
          }

          panel.querySelectorAll('[data-remove]').forEach(el => {
            el.addEventListener('click', () => {
              const kw = el.getAttribute('data-remove');
              smartState.keywords = smartState.keywords.filter(k => k !== kw);
              delete smartState.expansions[kw];
              smartSave();
              rerenderSmart();
            });
          });

          panel.querySelectorAll('[data-term]').forEach(el => {
            el.addEventListener('click', () => {
              const kw = el.getAttribute('data-kw');
              const term = el.getAttribute('data-term');
              const ex = smartState.expansions[kw];
              if (!ex) return;
              if (ex.off.has(term)) ex.off.delete(term); else ex.off.add(term);
              smartSave();
              rerenderSmart();
            });
          });

          // Dismiss a CV-derived suggestion. Persisted, so the server
          // regenerating the CV list on the next load does not bring it back.
          panel.querySelectorAll('[data-cv-remove]').forEach(el => {
            el.addEventListener('click', (ev) => {
              ev.stopPropagation();
              const term = el.getAttribute('data-cv-remove');
              if (!smartState.cvHidden.includes(term)) smartState.cvHidden.push(term);
              smartSave();
              rerenderSmart();
            });
          });

          const cvRestore = document.getElementById('smart-cv-restore');
          if (cvRestore) {
            cvRestore.addEventListener('click', () => {
              smartState.cvHidden = [];
              smartSave();
              rerenderSmart();
            });
          }

          panel.querySelectorAll('[data-add]').forEach(el => {
            el.addEventListener('click', () => smartAddKeyword(el.getAttribute('data-add')));
          });


          const run = document.getElementById('smart-run');
          if (run) {
            run.addEventListener('click', async () => {
              const terms = smartSelectedTerms();
              if (!terms.length) return;
              const scope = (document.getElementById('smart-scope') || {}).value || scrapeScope;
              const jobage = smartState.jobage;
              try {
                smartState.error = null;
                scrapeState.running = true;
                scrapeState.startedAt = new Date().toISOString();
                scrapeState.error = null;
                scrapeState.exitCode = null;
                scrapeState.progress = { done: 0, total: 0, percent: 0, label: 'Starting…' };
                document.getElementById('scrape-panel').innerHTML = renderScrapeContent();
                rerenderSmart();

                const res = await fetch(
                  '/api/scrape/adhoc?scope=' + encodeURIComponent(scope) + '&jobage=' + encodeURIComponent(jobage),
                  {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    // Expansion already happened in the preview above, so the
                    // server must not expand a second time.
                    body: JSON.stringify({ queries: terms, expand: false, llm: false }),
                  },
                );
                if (res.status === 409) { startScrapePoll(); return; }
                if (!res.ok) {
                  const e = await res.json().catch(() => ({}));
                  throw new Error(e.error || 'HTTP ' + res.status);
                }
                const data = await res.json();
                smartState.lastQueries = data.queries || terms;
                rerenderSmart();
                startScrapePoll();
              } catch (e) {
                scrapeState.running = false;
                smartState.error = e.message;
                document.getElementById('scrape-panel').innerHTML = renderScrapeContent();
                bindScrape();
                rerenderSmart();
              }
            });
          }
        };

        /**
         * Retire the completed progress bar.
         *
         * A finished bar is worth a glance ("did it work, how many jobs?") and
         * then it is just clutter sitting above the results. Only a SUCCESSFUL
         * run is auto-dismissed — a failure stays until the next run so the exit
         * code cannot scroll away unnoticed.
         */
        let progressDismissTimer = null;
        const PROGRESS_DISMISS_MS = 12000;

        const scheduleProgressDismiss = () => {
          if (progressDismissTimer) clearTimeout(progressDismissTimer);
          progressDismissTimer = setTimeout(() => {
            progressDismissTimer = null;
            // Re-check at fire time: a new run may have started since.
            if (scrapeState.running || scrapeState.exitCode !== 0) return;
            scrapeState.progressDismissed = true;
            const panel = document.getElementById('scrape-panel');
            if (panel) { panel.innerHTML = renderScrapeContent(); bindScrape(); }
          }, PROGRESS_DISMISS_MS);
        };

        const startScrapePoll = () => {
          // A new run supersedes any pending dismissal and makes the bar
          // relevant again.
          if (progressDismissTimer) { clearTimeout(progressDismissTimer); progressDismissTimer = null; }
          scrapeState.progressDismissed = false;
          if (scrapePollTimer) clearInterval(scrapePollTimer);

          scrapePollTimer = setInterval(async () => {
            try {
              const res = await fetch('/api/scrape');
              const state = await res.json();
              
              scrapeState.running = state.running;
              scrapeState.log = state.log || '';
              if (state.progress) scrapeState.progress = state.progress;
              if (state.exitCode !== undefined) scrapeState.exitCode = state.exitCode;
              if (state.startedAt) scrapeState.startedAt = state.startedAt;
              
              const panel = document.getElementById('scrape-panel');
              if (panel) {
                panel.innerHTML = renderScrapeContent();
                if (!scrapeState.running) bindScrape();
              }
              // Keep Smart Search's Run button in step with the scrape state —
              // it must stay disabled for the whole run, however the run began.
              if (smartState.open) rerenderSmart();
              
              if (!state.running) {
                clearInterval(scrapePollTimer);
                scrapePollTimer = null;
                // The scraper has just rewritten data/jobs.json. Pull it in and
                // re-render so the list reflects the run that finished, instead
                // of the snapshot this page was loaded with.
                if (state.exitCode === 0) {
                  const ok = await refreshJobsData();
                  if (!ok) {
                    scrapeState.error = 'Scrape finished but the results could not be loaded. Reload the page.';
                    const p2 = document.getElementById('scrape-panel');
                    if (p2) { p2.innerHTML = renderScrapeContent(); bindScrape(); }
                  } else {
                    scheduleProgressDismiss();
                  }
                }
              }

            } catch (e) {
              clearInterval(scrapePollTimer);
              scrapeState.running = false;
              scrapeState.error = 'Poll failed: ' + e.message;
              const panel = document.getElementById('scrape-panel');
              if (panel) {
                panel.innerHTML = renderScrapeContent();
                bindScrape();
              }
              if (smartState.open) rerenderSmart();
            }
          }, 2000);
        };
        
        smartLoad();
        // bindScrape() delegates to bindSmart() when Smart Search is open.
        // Calling bindSmart() here as well attached the toggle listener twice,
        // so the first click after page load opened and immediately closed it.
        bindScrape();
        // Previews stored by an older expansion engine are refreshed in the
        // background; smartExpand keeps the user's deselections. Runs after
        // bindScrape(): each refresh re-renders the panel and binds the new
        // markup itself, so nothing is bound twice.
        smartState.keywords.forEach((kw) => {
          const ex = smartState.expansions[kw];
          if (!ex || ex.engine !== EXPAND_ENGINE) smartExpand(kw);
        });

        // Fold Smart Search to its header once the user scrolls down to the
        // jobs; "Expand" brings it back. Registered once (this block can re-run)
        // and it reads the current smartState on every event.
        if (!window.__smartCollapseBound) {
          window.__smartCollapseBound = true;
          let lastY = window.scrollY;
          window.addEventListener('scroll', () => {
            const y = window.scrollY;
            const down = y > lastY;
            lastY = y;
            if (!down || y < 80 || !smartState.open || smartState.collapsed) return;
            const p = document.getElementById('scrape-panel');
            // Never fold the panel out from under someone typing in it.
            if (!p || p.contains(document.activeElement)) return;
            // Folding shrinks content ABOVE the job list; shift the scroll by the
            // same amount so the jobs on screen stay where they are.
            const before = p.offsetHeight;
            smartState.collapsed = true;
            p.innerHTML = renderScrapeContent();
            bindScrape();
            const shrink = before - p.offsetHeight;
            if (shrink > 0) window.scrollTo({ top: Math.max(0, y - shrink), behavior: 'instant' });
            lastY = window.scrollY;
          }, { passive: true });
        }

        // A restored keyword whose expansion was never cached (saved mid-flight,
        // or written by an older build) still needs expanding once.
        if (smartState.open) {
          if (!smartState.cv && !smartState.cvLoading) smartLoadCv();
          smartState.keywords
            .filter(kw => !smartState.expansions[kw] || !smartState.expansions[kw].terms)
            .forEach(smartExpand);
        }

        // A scrape started before this page was loaded (or survived a reload)
        // must still show its progress — otherwise the bar looks frozen at idle
        // while the server is halfway through a run.
        if (isHttp) {
          fetch('/api/scrape')
            .then(r => r.json())
            .then(state => {
              // The per-search term limit gates the Smart Search run button.
              if (state && Number.isInteger(state.maxAdhocQueries) && state.maxAdhocQueries > 0) {
                smartState.maxTerms = state.maxAdhocQueries;
                if (smartState.open) rerenderSmart();
              }
              if (!state || !state.running) return;
              scrapeState.running = true;
              scrapeState.log = state.log || '';
              scrapeState.progress = state.progress || null;
              scrapeState.startedAt = state.startedAt || null;
              const panel = document.getElementById('scrape-panel');
              if (panel) panel.innerHTML = renderScrapeContent();
              startScrapePoll();
            })
            .catch(() => {});
        }
      };

      // Bootstrap
      loadJobStates().then(() => {
        initUI();
      });
    })();
  </script>
</body>
</html>
